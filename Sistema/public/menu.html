<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="img/icone.png">
    <title>Cardápio Digital 🍽️</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* ================== DESIGN SYSTEM LIGHT PREMIUM ================== */
        :root {
            --bg-main: #F7F9FC;
            --bg-card: #FFFFFF;
            --text-primary: #1A202C;
            --text-secondary: #718096;
            --color-blue: #2B6CB0;
            --color-green: #38A169;
            --border-color: #E2E8F0;
            --radius: 12px;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-primary);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* HEADER PREMIUM */
        header {
            background: var(--color-blue);
            padding: 20px 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom-left-radius: 15px;
            border-bottom-right-radius: 15px;
        }

        .header-content {
            display: flex;
            align-items: center; 
            justify-content: center; 
            gap: 15px; 
            max-width: 600px;
            margin: 0 auto;
        }

        .header-logo {
            width: 65px;
            height: 65px;
            border-radius: 50%; 
            object-fit: cover; 
            border: 3px solid #FFFFFF;
            display: none; /* Oculta por padrão até carregar */
            background-color: #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .header-info {
            text-align: left; 
        }

        .restaurant-name {
            font-size: 1.4rem;
            font-weight: 700;
            color: #FFFFFF;
            margin: 0;
            letter-spacing: 0.5px;
            line-height: 1.2;
        }

        .restaurant-slogan {
            font-size: 0.9rem; 
            color: rgba(255, 255, 255, 0.85); 
            margin-top: 4px;
            font-weight: 300;
        }

        main {
            max-width: 650px;
            margin: 0 auto;
            padding: 20px;
            width: 100%;
            box-sizing: border-box;
            padding-bottom: 50px;
        }

        /* CATEGORIAS */
        .category-title {
            color: var(--color-blue);
            font-size: 1.3rem;
            font-weight: bold;
            margin: 30px 0 15px 0;
            border-left: 4px solid var(--color-blue);
            padding-left: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* CARTÃO DE PRODUTO */
        .product-card {
            background-color: var(--bg-card);
            border-radius: var(--radius);
            padding: 18px;
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
            transition: 0.2s ease;
            animation: fadeIn 0.4s ease forwards;
        }

        .product-card:hover {
            border-color: var(--color-blue);
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.06);
        }

        .product-info { flex: 1; }

        .product-name {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-primary);
            line-height: 1.3;
        }

        .product-desc {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 10px;
            line-height: 1.4;
        }

        .product-price {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--color-green);
        }

        /* LOADING E ERRO */
        #loading { 
            text-align: center; 
            margin-top: 50px; 
            color: var(--text-secondary); 
            font-size: 1.1rem;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-2BTBZ5MK63"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-2BTBZ5MK63');
    </script>
</head>
<body>

    <header>
        <div class="header-content">
            <img id="rest-logo" class="header-logo" alt="Logo Restaurante">
            
            <div class="header-info">
                <div class="restaurant-name" id="rest-name">Carregando...</div>
                <div class="restaurant-slogan">Cardápio Digital</div>
            </div>
        </div>
    </header>

    <main id="menu-container">
        <div id="loading">Buscando as melhores opções para você... 🍳</div>
    </main>

    <script>
        // Pega o ID da empresa pela URL (ex: menu.html?id=1)
        const urlParams = new URLSearchParams(window.location.search);
        const companyId = urlParams.get('id');

        async function loadMenu() {
            if (!companyId) {
                document.getElementById('menu-container').innerHTML = "<div class='product-card'><p style='color: var(--color-red); text-align:center; width: 100%; font-weight: bold;'>Ops! Restaurante não identificado.</p></div>";
                return;
            }

            try {
                // Chamada para a rota pública
                const response = await fetch(`/api/public/menu/${companyId}`);
                const data = await response.json();

                if (!data.menu || data.menu.length === 0) {
                    document.getElementById('menu-container').innerHTML = "<p style='text-align:center; color: var(--text-secondary); margin-top: 40px;'>O cardápio está sendo atualizado no momento. Volte logo!</p>";
                    document.getElementById('rest-name').innerText = data.restaurant || "Digital Menu";
                    return;
                }

                // ============ 1. ATUALIZA NOME ============
                document.getElementById('rest-name').innerText = data.restaurant;

                // ============ 2. ATUALIZA LOGO (AUTOMÁTICO) ============
                const logoImg = document.getElementById('rest-logo');
                
                // Monta o caminho: pasta "img" + nome padrão + ID da empresa
                const logoPath = `img/logo-companyid-${companyId}.png?v=${Date.now()}`;

                logoImg.src = logoPath;
                logoImg.style.display = 'block';

                // SE A IMAGEM NÃO EXISTIR (Erro 404), ESCONDE A BOLINHA
                logoImg.onerror = function() {
                    this.style.display = 'none';
                };
                // =======================================================

                const container = document.getElementById('menu-container');
                container.innerHTML = ""; // Limpa o loading

                // Agrupar por categoria
                const categories = [...new Set(data.menu.map(p => p.category))];

                categories.forEach(cat => {
                    const catTitle = document.createElement('div');
                    catTitle.className = 'category-title';
                    catTitle.innerText = cat;
                    container.appendChild(catTitle);

                    const products = data.menu.filter(p => p.category === cat);
                    
                    products.forEach(p => {
                        const card = document.createElement('div');
                        card.className = 'product-card';
                        card.innerHTML = `
                            <div class="product-info">
                                <div class="product-name">${p.name}</div>
                                ${p.description ? `<div class="product-desc">${p.description}</div>` : ''}
                                <div class="product-price">R$ ${p.price.toFixed(2).replace('.', ',')}</div>
                            </div>
                        `;
                        container.appendChild(card);
                    });
                });

            } catch (err) {
                console.error(err);
                document.getElementById('menu-container').innerHTML = "<p style='text-align:center; color: var(--color-red); margin-top: 40px;'>Erro ao carregar o cardápio. Tente recarregar a página.</p>";
            }
        }

        loadMenu();
    </script>
</body>
</html>
