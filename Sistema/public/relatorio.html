<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>📊 Relatório de Vendas</title>
  
  <link rel="stylesheet" href="css/style.css" />
  
  <style>
    /* Estilos específicos para o efeito de "Abre e Fecha" do relatório */
    .dia-group {
      margin-bottom: 15px;
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .dia-header {
      background: var(--bg-card);
      padding: 15px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
      color: var(--color-amber);
      transition: background 0.2s;
    }
    .dia-header:hover { background: #3a3f44; }
    
    .dia-content {
      display: none;
      padding: 15px;
      background: var(--bg-main);
      border-top: 1px solid var(--border-color);
    }

    .pedido-card {
      background: var(--bg-card);
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 10px;
      border-left: 4px solid var(--color-green);
    }
    
    .resumo-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-bottom: 25px;
    }
    
    .kpi-card {
      background: var(--bg-card);
      padding: 20px;
      border-radius: var(--radius);
      text-align: center;
      border: 1px solid var(--border-color);
    }
    .kpi-card span { display: block; color: var(--text-secondary); font-size: 0.9rem; }
    .kpi-card strong { font-size: 1.4rem; color: var(--color-blue); }
  </style>
</head>
<body>

  <header>
    <div class="menu-wrapper">
      <button class="menu-button" onclick="toggleMenu()">⋮</button>
      <div id="menuDropdown" class="menu-dropdown">
        <div onclick="window.location.href='index.html'">📙 Cardápio</div>
        <div onclick="window.location.href='meus-pedidos.html'">🧾 Meus pedidos</div>
        <div onclick="window.location.href='cozinha.html'">👨‍🍳 Cozinha</div>
        <div onclick="window.location.href='configuracoes.html'">⚙️ Configurações</div>
      </div>
    </div>
    <div class="header-title">📊 Relatório de Vendas</div>
  </header>

  <main>
    <div id="resumo" class="resumo-grid">
        <div class="kpi-card"><span>Carregando...</span></div>
        <div class="kpi-card"><span>Carregando...</span></div>
    </div>

    <section id="listaPedidos">
        <p style="text-align: center; color: var(--text-secondary);">Buscando histórico...</p>
    </section>
  </main>

  <script>
  document.addEventListener("DOMContentLoaded", async () => {
    const user = JSON.parse(localStorage.getItem("user") || "{}");
    const company_id = user.company_id;
    const resumoEl = document.getElementById("resumo");
    const listaEl = document.getElementById("listaPedidos");

    if (!company_id) {
      listaEl.innerHTML = "<p style='color:var(--color-red); text-align:center;'>Empresa não identificada.</p>";
      return;
    }

    try {
      const res = await fetch(`/api/orders/history?company_id=${company_id}`);
      const data = await res.json();

      if (!data.ok) throw new Error(data.error || "Erro ao carregar histórico.");

      const pedidos = data.pedidos || [];
      if (pedidos.length === 0) {
        resumoEl.innerHTML = "";
        listaEl.innerHTML = "<div class='box'><p style='text-align:center;'>Nenhum pedido finalizado ainda.</p></div>";
        return;
      }

      // 1. Resumo Geral (KPIs)
      const totalVendas = pedidos.reduce((s, p) => s + (Number(p.total) || 0), 0);
      resumoEl.innerHTML = `
        <div class="kpi-card">
            <span>Total de Pedidos</span>
            <strong>${pedidos.length}</strong>
        </div>
        <div class="kpi-card">
            <span>Faturamento Total</span>
            <strong style="color: var(--color-green);">R$ ${totalVendas.toFixed(2).replace('.',',')}</strong>
        </div>
      `;

      // 2. Agrupar por dia
      const porDia = {};
      pedidos.forEach(p => {
        const dataDia = new Date(p.status_updated_at || p.created_at).toLocaleDateString("pt-BR");
        if (!porDia[dataDia]) porDia[dataDia] = [];
        porDia[dataDia].push(p);
      });

      // 3. Renderizar Acordeões
      listaEl.innerHTML = Object.keys(porDia).sort((a,b) => b.localeCompare(a))
        .map(dia => {
          const totalDia = porDia[dia].reduce((s, p) => s + (Number(p.total) || 0), 0);
          
          const conteudo = porDia[dia].map(p => {
            let items = [];
            try { items = Array.isArray(p.items) ? p.items : JSON.parse(p.items || "[]"); } catch {}
            
            return `
              <div class="pedido-card">
                <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
                  <span style="font-weight:bold; color:var(--color-blue);">#${p.id}</span>
                  <small style="color:var(--text-secondary);">${new Date(p.status_updated_at).toLocaleTimeString("pt-BR", {hour:'2-digit', minute:'2-digit'})}</small>
                </div>
                <div style="font-size:0.95rem; margin-bottom:8px;">
                  ${items.map(i => `<span style="color:var(--color-amber);">${i.qty}x</span> ${i.name}`).join("<br>")}
                </div>
                <div style="display:flex; justify-content:space-between; align-items:center; border-top:1px solid #3a3f44; pt-8px; margin-top:8px; padding-top:8px;">
                  <small>${p.table_name ? `Mesa: ${p.table_name}` : 'Balcão'}</small>
                  <strong>R$ ${Number(p.total).toFixed(2).replace('.',',')}</strong>
                </div>
              </div>
            `;
          }).join("");

          return `
            <div class="dia-group">
              <div class="dia-header" onclick="toggleDia(this)">
                <span>📅 ${dia}</span>
                <span>R$ ${totalDia.toFixed(2).replace('.',',')} ⯆</span>
              </div>
              <div class="dia-content">${conteudo}</div>
            </div>
          `;
        }).join("");

    } catch (err) {
      listaEl.innerHTML = `<p style="color:var(--color-red); text-align:center;">${err.message}</p>`;
    }
  });

  // Função para abrir/fechar o dia
  function toggleDia(header) {
    const content = header.nextElementSibling;
    const isVisible = content.style.display === 'block';
    content.style.display = isVisible ? 'none' : 'block';
    header.querySelector('span:last-child').innerHTML = isVisible ? `R$ ... ⯆` : `R$ ... ⯈`;
    // (Pequeno ajuste: recarregar o texto do total no toggle se quiser, mas o básico acima já funciona)
  }

  function toggleMenu() {
    document.getElementById("menuDropdown").classList.toggle("show");
  }
  </script>
</body>
</html>
