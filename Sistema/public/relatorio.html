<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>📊 Relatório de Vendas</title>
  
  <link rel="stylesheet" href="css/style.css" />
  
  <style>
    :root {
      --bg-card: #1a1a1a;
      --border-color: #2c2f33;
      --color-amber: #fcc419;
      --color-green: #51cf66;
      --color-blue: #339af0;
    }

    .resumo-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-bottom: 25px;
    }
    
    .kpi-card {
      background: var(--bg-card);
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      border: 1px solid var(--border-color);
    }
    .kpi-card span { display: block; color: #adb5bd; font-size: 0.9rem; }
    .kpi-card strong { font-size: 1.4rem; color: var(--color-blue); }

    .dia-group {
      margin-bottom: 15px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
    }
    .dia-header {
      background: var(--bg-card);
      padding: 15px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
    }
    .dia-content {
      display: none;
      padding: 15px;
      background: #0d0d0d;
    }

    .pedido-card {
      background: #252a2e;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 10px;
      border-left: 4px solid var(--color-green);
    }

    /* Menu Dropdown */
    .menu-dropdown {
      display: none;
      position: absolute;
      background: #1e1e1e;
      border: 1px solid var(--border-color);
      right: 30px;
      top: 60px;
      z-index: 100;
    }
    .menu-dropdown.show { display: block; }
    .menu-dropdown div { padding: 10px 20px; cursor: pointer; border-bottom: 1px solid #333; }
  </style>
</head>
<body>

<header>
  <div class="menu-wrapper">
    <button class="menu-button" onclick="toggleMenu()">⋮</button>
    <div id="menuDropdown" class="menu-dropdown">
      <div onclick="window.location.href='index.html'">📙 Cardápio</div>
      <div onclick="window.location.href='cozinha.html'">👨‍🍳 Cozinha</div>
      <div onclick="window.location.href='relatorio.html'">📈 Relatório</div>
      <div onclick="window.location.href='configuracoes.html'">⚙️ Configurações</div>
      <div onclick="window.location.href='company-admin.html'">🏢 Painel da Empresa</div>
    </div>
  </div>
  <div class="header-title">Relatório 🧾</div>
</header>

  <main style="padding: 20px;">
    <div id="resumo" class="resumo-grid">
        <div class="kpi-card"><span>Pedidos</span><strong>...</strong></div>
        <div class="kpi-card"><span>Total</span><strong>...</strong></div>
    </div>

    <section id="listaPedidos">
        <p style="text-align: center; color: #888;">Buscando histórico de vendas...</p>
    </section>
  </main>

  <script>
    // Funções Globais
    window.toggleMenu = () => document.getElementById("menuDropdown").classList.toggle("show");
    
    window.toggleDia = (header) => {
      const content = header.nextElementSibling;
      content.style.display = (content.style.display === 'block') ? 'none' : 'block';
    };

    document.addEventListener("DOMContentLoaded", async () => {
      // 1. Pegar dados do usuário (Importante: usar company_id com underline)
      const user = JSON.parse(localStorage.getItem("user") || "{}");
      const company_id = user.company_id || user.id;

      const resumoEl = document.getElementById("resumo");
      const listaEl = document.getElementById("listaPedidos");

      if (!company_id) {
        listaEl.innerHTML = "<p style='color:red; text-align:center;'>Empresa não identificada. Faça login novamente.</p>";
        return;
      }

      try {
        // 2. Chamar a API de histórico
        const res = await fetch(`/api/orders/history?company_id=${company_id}`);
        const data = await res.json();

        if (!data.ok) throw new Error(data.error || "Erro ao carregar dados.");

        const pedidos = data.pedidos || [];
        if (pedidos.length === 0) {
          resumoEl.innerHTML = "";
          listaEl.innerHTML = "<p style='text-align:center; color:#888;'>Nenhum pedido finalizado encontrado.</p>";
          return;
        }

        // 3. Calcular Resumo Geral
        const totalVendas = pedidos.reduce((s, p) => s + (Number(p.total) || 0), 0);
        resumoEl.innerHTML = `
          <div class="kpi-card">
              <span>Total de Pedidos</span>
              <strong>${pedidos.length}</strong>
          </div>
          <div class="kpi-card">
              <span>Faturamento Total</span>
              <strong style="color: var(--color-green);">R$ ${totalVendas.toFixed(2).replace('.',',')}</strong>
          </div>
        `;

        // 4. Agrupar por data
        const porDia = {};
        pedidos.forEach(p => {
          const dia = new Date(p.status_updated_at || p.created_at).toLocaleDateString("pt-BR");
          if (!porDia[dia]) porDia[dia] = [];
          porDia[dia].push(p);
        });

        // 5. Gerar a lista com efeito Abre/Fecha
        listaEl.innerHTML = Object.keys(porDia).sort((a,b) => {
           return b.split('/').reverse().join('') - a.split('/').reverse().join('');
        }).map(dia => {
          const totalDia = porDia[dia].reduce((s, p) => s + (Number(p.total) || 0), 0);
          
          const cardsHtml = porDia[dia].map(p => {
            let items = [];
            try { items = Array.isArray(p.items) ? p.items : JSON.parse(p.items || "[]"); } catch { items = []; }
            
            return `
              <div class="pedido-card">
                <div style="display:flex; justify-content:space-between; margin-bottom:5px;">
                  <span style="color:var(--color-blue); font-weight:bold;">#${p.id}</span>
                  <small style="color:#888;">${new Date(p.status_updated_at || p.created_at).toLocaleTimeString("pt-BR", {hour:'2-digit', minute:'2-digit'})}</small>
                </div>
                <div style="font-size:0.9rem; margin-bottom:8px;">
                  ${items.map(i => `<span style="color:var(--color-amber);">${i.qty}x</span> ${i.name}`).join("<br>")}
                </div>
                <div style="display:flex; justify-content:space-between; border-top: 1px solid #333; padding-top:8px;">
                  <small>${p.table_name ? 'Mesa: '+p.table_name : 'Balcão'}</small>
                  <strong>R$ ${Number(p.total).toFixed(2).replace('.',',')}</strong>
                </div>
              </div>
            `;
          }).join("");

          return `
            <div class="dia-group">
              <div class="dia-header" onclick="toggleDia(this)">
                <span>📅 ${dia}</span>
                <span style="color:var(--color-green)">R$ ${totalDia.toFixed(2).replace('.',',')} ▾</span>
              </div>
              <div class="dia-content">${cardsHtml}</div>
            </div>
          `;
        }).join("");

      } catch (err) {
        console.error(err);
        listaEl.innerHTML = `<p style="color:red; text-align:center;">Erro ao carregar: ${err.message}</p>`;
      }
    });
  </script>
</body>
</html>
