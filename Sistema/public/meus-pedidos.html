<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>🧾 Meus Pedidos</title>
  
  <link rel="stylesheet" href="css/style.css" />
  
  <style>
    .status-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: bold;
      text-transform: uppercase;
    }
    .status-novo { background: var(--bg-main); color: var(--color-amber); border: 1px solid var(--color-amber); }
    .status-preparo { background: var(--color-blue); color: white; }
    .status-pronto { background: var(--color-green); color: white; }
    
    .pedido-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 15px;
      margin-bottom: 15px;
      box-shadow: var(--shadow);
      transition: all 0.3s ease;
    }

    @keyframes pulse {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.02); opacity: 0.9; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

<header>
  <div class="menu-wrapper">
    <button class="menu-button" onclick="toggleMenu()">⋮</button>
    <div id="menuDropdown" class="menu-dropdown">
      <div onclick="window.location.href='index.html'">📙 Cardápio</div>
      <div onclick="window.location.href='cozinha.html'">👨‍🍳 Cozinha</div>
      <div onclick="window.location.href='relatorio.html'">📈 Relatório</div>
      <div onclick="window.location.href='configuracoes.html'">⚙️ Configurações</div>
      <div onclick="window.location.href='company-admin.html'">🏢 Painel da Empresa</div>
    </div>
  </div>
  <div class="header-title">🧾 Meus Pedidos</div>
</header>

<main>
  <div id="pedidosList">
    <p style="text-align:center; margin-top: 20px; color: var(--text-secondary);">Acompanhando seus pedidos...</p>
  </div>
</main>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const lista = document.getElementById("pedidosList");
  const user = JSON.parse(localStorage.getItem("user") || "{}");
  const company_id = user.company_id;
  const TEMPO_OCULTAR_PRONTO = 5 * 60 * 1000; 
  let pedidos = [];
  let idUltimoAlerta = null; 

  if (!company_id) {
    lista.innerHTML = `<div class='box'><p style='color:var(--color-red); text-align:center;'>Empresa não identificada. Por favor, faça login.</p></div>`;
    return;
  }

  // --- FUNÇÕES DE NOTIFICAÇÃO ---
  function dispararSom() {
    // Som de "Ding" profissional
    const ping = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');
    ping.play().catch(() => console.log("Áudio aguardando interação do usuário."));
  }

  function piscarTitulo() {
    const tituloOriginal = "🧾 Meus Pedidos";
    let troca = true;
    const loop = setInterval(() => {
        document.title = troca ? "🔔 PEDIDO PRONTO!" : "🧾 MEUS PEDIDOS";
        troca = !troca;
    }, 800);

    window.addEventListener('focus', () => {
        clearInterval(loop);
        document.title = tituloOriginal;
    }, { once: true });
  }

  function renderizar() {
    if (pedidos.length === 0) {
      lista.innerHTML = `
        <div style="text-align:center; margin-top:50px; color: var(--text-secondary);">
            <div style="font-size: 3rem;">🧺</div>
            <p>Você não tem pedidos ativos no momento.</p>
            <button class="btn" onclick="window.location.href='index.html'" style="margin-top:15px;">Ir para o Cardápio</button>
        </div>`;
      return;
    }

    lista.innerHTML = pedidos.map(p => {
      let items = [];
      try { items = Array.isArray(p.items) ? p.items : JSON.parse(p.items || "[]"); } catch {}
      
      const hora = new Date(p.created_at).toLocaleTimeString("pt-BR", {hour:"2-digit",minute:"2-digit"});
      
      let statusClass = "status-novo";
      let statusTxt = "🕒 Aguardando Cozinha";
      let alertVisual = ""; 

      if(p.status === "preparando" || p.status === "em preparo") {
          statusClass = "status-preparo";
          statusTxt = "🍳 Sendo Preparado";
      } else if(p.status === "pronto") {
          statusClass = "status-pronto";
          statusTxt = "✅ Pronto para Retirar";
          alertVisual = `
            <div style="margin-top:10px; text-align:center; background:rgba(81, 207, 102, 0.15); 
                 padding:10px; border-radius:8px; border: 1px dashed var(--color-green); 
                 animation: pulse 2s infinite; color: var(--color-green); font-weight: bold;">
                 🚀 Ficou pronto! Pode vir buscar que tá quentinho!
            </div>
          `;
      }

      return `
        <div class="pedido-card">
          <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:12px;">
            <div>
                <b style="color:var(--color-blue); font-size:1.1rem;">Pedido #${p.id}</b>
                <div style="font-size:0.8rem; color:var(--text-secondary);">${hora} — ${p.table_name ? 'Mesa ' + p.table_name : 'Balcão'}</div>
            </div>
            <span class="status-badge ${statusClass}">${statusTxt}</span>
          </div>

          <div style="background:var(--bg-main); padding:10px; border-radius:6px; margin-bottom:10px; font-family:monospace;">
            ${items.map(i => `<div><span style="color:var(--color-blue); font-weight:bold;">${i.qty}x</span> ${i.name}</div>`).join("")}
          </div>

          ${p.notes ? `<div style="font-size:0.85rem; color:var(--text-secondary); font-style:italic;"><strong>Obs:</strong> ${p.notes}</div>` : ""}
          ${alertVisual}
        </div>
      `;
    }).join("");
  }

  async function carregarPedidos() {
    try {
      const res = await fetch(`/api/orders?company_id=${company_id}`);
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || "Erro ao carregar.");

      // --- LÓGICA DE NOTIFICAÇÃO MELHORADA ---
      const listaProntos = data.pedidos.filter(p => p.status === 'pronto');
      
      if (listaProntos.length > 0) {
          const idMaisRecente = Math.max(...listaProntos.map(p => p.id));
          
          // Se for a primeira vez que carrega, apenas memoriza o ID sem apitar
          if (idUltimoAlerta === null) {
              idUltimoAlerta = idMaisRecente;
          } 
          // Se aparecer um ID maior do que o memorizado, aí sim notifica
          else if (idMaisRecente > idUltimoAlerta) {
              idUltimoAlerta = idMaisRecente;
              dispararSom();
              piscarTitulo();
          }
      }

      const agora = Date.now();
      pedidos = data.pedidos.filter(p => {
        if (p.status === "cancelado") return false;
        if (p.status === "pronto") {
          // Fallback de data para evitar que o pedido suma por erro de fuso horário
          const dataRef = p.status_updated_at || p.created_at;
          if (!dataRef) return true;

          const atualizado = new Date(dataRef).getTime();
          const diferenca = agora - atualizado;
          
          // Só esconde se tiver passado de 5 min e a data for válida
          return isNaN(diferenca) ? true : diferenca < TEMPO_OCULTAR_PRONTO;
        }
        return true;
      });

      renderizar();
    } catch (err) {
      console.error(err);
    }
  }

  carregarPedidos();
  setInterval(carregarPedidos, 5000); 
});

function toggleMenu() {
  document.getElementById("menuDropdown").classList.toggle("show");
}
</script>

</body>
</html>
