<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="icon" type="image/png" href="img/icone.png">
  <title>🧾 Meus Pedidos</title>
  
  <link rel="stylesheet" href="css/style.css" />
  
  <style>
    .status-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: bold;
      text-transform: uppercase;
    }
    .status-novo { background: var(--bg-main); color: var(--color-amber); border: 1px solid var(--color-amber); }
    .status-preparo { background: var(--color-blue); color: white; }
    .status-pronto { background: var(--color-green); color: white; }
    
    /* Nova classe para o status cancelado */
    .status-cancelado { background: #fa5252; color: white; border: 1px solid #fa5252; }
    
    .pedido-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 15px;
      margin-bottom: 15px;
      box-shadow: var(--shadow);
    }

    /* Borda vermelha para destacar o card inteiro se for cancelado TOTAL */
    .pedido-card.card-cancelado {
      border-left: 5px solid #fa5252;
    }

    @keyframes pulse {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.02); opacity: 0.9; }
      100% { transform: scale(1); opacity: 1; }
    }

    .menu-dropdown {
      display: none;
      position: absolute;
      background: #1a1d21;
      border: 1px solid var(--border-color);
      right: 30px;
      top: 60px;
      z-index: 100;
    }
    .menu-dropdown.show { display: block; }
    .menu-dropdown div { padding: 10px 20px; cursor: pointer; border-bottom: 1px solid #333; }
  </style>
</head>
<body>

<header>
  <div class="menu-wrapper">
    <button class="menu-button" onclick="toggleMenu()">⋮</button>
    <div id="menuDropdown" class="menu-dropdown">
      <div onclick="location.href='index.html'">Cardapio 📙</div>
      <div onclick="location.href='meus-pedidos.html'">Meus pedidos 🧾</div>
      <div onclick="location.href='relatorio.html'">Relatório 📈</div>
      <div onclick="window.location.href='bar.html'">Bar🍹</div>
      <div onclick="location.href='cozinha.html'">Cozinha 👨‍🍳</div>
      <div onclick="location.href='configuracoes.html'">Configurações ⚙️</div>
      <div onclick="location.href='company-admin.html'">Painel da Empresa 🏢</div>
      <div onclick="location.href='tutorial.html'">Tutoriais 📚</div>
      <div onclick="location.href='support.html'">Suporte 🛠️</div>
      <div onclick="logout()" style="color: var(--color-red);">Sair do Sistema 🚪</div>
    </div>
  </div>
  <div class="header-title">Meus Pedidos 🧾</div>
</header>

<main>
  <div id="pedidosList">
    <p style="text-align:center; margin-top: 20px; color: var(--text-secondary);">Acompanhando seus pedidos...</p>
  </div>
</main>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const lista = document.getElementById("pedidosList");
  const user = JSON.parse(localStorage.getItem("user") || "{}");
  const company_id = user.company_id;
  const CINCO_MINUTOS = 5 * 60 * 1000; 
  let pedidos = [];
  let idUltimoAlerta = null; 

  if (!company_id) {
    lista.innerHTML = `<div class='box'><p style='color:var(--color-red); text-align:center;'>Empresa não identificada.</p></div>`;
    return;
  }

  function piscarTitulo() {
    const tituloOriginal = "🧾 Meus Pedidos";
    let troca = true;
    const loop = setInterval(() => {
        document.title = troca ? "🔔 PEDIDO PRONTO!" : "🧾 MEUS PEDIDOS";
        troca = !troca;
    }, 800);
    window.addEventListener('focus', () => {
        clearInterval(loop);
        document.title = tituloOriginal;
    }, { once: true });
  }

  function renderizar() {
    if (pedidos.length === 0) {
      lista.innerHTML = `<div style="text-align:center; margin-top:50px; color: var(--text-secondary);">
            <div style="font-size: 3rem;">🧺</div>
            <p>Nenhum pedido ativo.</p>
        </div>`;
      return;
    }

    lista.innerHTML = pedidos.map(p => {
      let items = [];
      try { items = Array.isArray(p.items) ? p.items : JSON.parse(p.items || "[]"); } catch {}
      
      const hora = new Date(p.created_at).toLocaleTimeString("pt-BR", {hour:"2-digit",minute:"2-digit"});
      
      // Lógica de Status Dinâmica
      let statusClass = "status-novo";
      let statusTxt = "🕒 Aguardando Preparo";
      let alertVisual = ""; 
      let cardExtraClass = "";

      // 1. Identificar cancelamentos parciais
      const barCancelado = p.status_bar === 'cancelado';
      const cozinhaCancelada = p.status_cozinha === 'cancelado';

      if(p.status === "preparando" || p.status === "em preparo") {
          statusClass = "status-preparo";
          statusTxt = "🍳 Sendo Preparado";
      } else if(p.status === "pronto") {
          statusClass = "status-pronto";
          statusTxt = "✅ Pronto para Retirar";
          alertVisual = `<div style="margin-top:10px; text-align:center; background:rgba(81, 207, 102, 0.15); 
                 padding:10px; border-radius:8px; border: 1px dashed var(--color-green); 
                 animation: pulse 2s infinite; color: var(--color-green); font-weight: bold;">
                 🚀 Ficou pronto! Pode vir buscar!
            </div>`;
      } else if(p.status === "cancelado") {
          statusClass = "status-cancelado";
          statusTxt = "❌ Cancelado";
          cardExtraClass = "card-cancelado";
          alertVisual = `<div style="margin-top:10px; text-align:center; background:rgba(250, 82, 82, 0.15); 
                 padding:10px; border-radius:8px; border: 1px dashed #fa5252; 
                 color: #fa5252; font-weight: bold;">
                 ⚠️ Pedido totalmente cancelado!
            </div>`;
      }

      // 2. Renderizar itens com lógica de risco individual
      const itemsHtml = items.map(i => {
          // Verifica se este item específico pertence a um setor cancelado
          const destino = i.destination || 'cozinha';
          const estaCancelado = (destino === 'bar' && barCancelado) || (destino !== 'bar' && cozinhaCancelada);
          
          const style = estaCancelado ? 'text-decoration: line-through; color: #fa5252; opacity: 0.6;' : '';
          const label = estaCancelado ? ' <span style="font-size: 0.7rem; font-weight: bold;">(CANCELADO)</span>' : '';

          return `<div style="${style}"><span style="color:var(--color-blue); font-weight:bold;">${i.qty}x</span> ${i.name}${label}</div>`;
      }).join("");

      return `
        <div class="pedido-card ${cardExtraClass}">
          <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:12px;">
            <div>
                <b style="color:var(--color-blue); font-size:1.1rem;">Pedido #${p.id}</b>
                <div style="font-size:0.8rem; color:var(--text-secondary);">${hora} — ${p.table_name || 'Balcão'}</div>
            </div>
            <span class="status-badge ${statusClass}">${statusTxt}</span>
          </div>
          <div style="background:var(--bg-main); padding:10px; border-radius:6px; margin-bottom:10px; font-family:monospace;">
            ${itemsHtml}
          </div>
          ${p.notes ? `<div style="font-size:0.85rem; color:var(--text-secondary); font-style:italic;"><strong>Obs:</strong> ${p.notes}</div>` : ""}
          ${alertVisual}
        </div>`;
    }).join("");
  }

  async function carregarPedidos() {
    try {
      const res = await fetch(`/api/orders?company_id=${company_id}`);
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || "Erro.");

      const listaProntos = data.pedidos.filter(p => p.status === 'pronto');
      if (listaProntos.length > 0) {
          const idMaisRecente = Math.max(...listaProntos.map(p => p.id));
          if (idUltimoAlerta !== null && idMaisRecente > idUltimoAlerta) {
              piscarTitulo();
          }
          idUltimoAlerta = idMaisRecente;
      }

      const agora = new Date().getTime();
      pedidos = data.pedidos.filter(p => {
        if (p.status === "entregue" || p.status === "pago") return false; 
        
        if (p.status === "pronto" || p.status === "cancelado") {
          const dataRef = p.status_updated_at || p.created_at;
          const atualizado = new Date(dataRef).getTime();
          const diferenca = agora - atualizado;
          return diferenca < CINCO_MINUTOS;
        }
        
        return true; 
      });

      renderizar();
    } catch (err) {
      console.error(err);
    }
  }

  carregarPedidos();
  setInterval(carregarPedidos, 5000); 
});

function toggleMenu() {
  document.getElementById("menuDropdown").classList.toggle("show");
}
function logout() {
  localStorage.removeItem("user");
  window.location.href = 'login.html';
}
</script>

</body>
</html>
