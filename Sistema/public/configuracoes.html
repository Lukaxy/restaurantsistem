<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>⚙️ Configurações - Cardápio</title>

  <link rel="stylesheet" href="css/configuracoes.css" />

  <style>
    body {
      background: #111;
      color: #fff;
      font-family: "Poppins", Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
    header {
      background: #1a1a1a;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    }
    .header-title {
      font-weight: 600;
      font-size: 1.1rem;
    }
    main {
      padding: 20px;
    }
    h3.section-title {
      margin-top: 0;
      margin-bottom: 12px;
      font-weight: 500;
      color: #ffb347;
    }
    .form-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
    }
    .form-input {
      background: #1c1c1c;
      border: 1px solid #333;
      border-radius: 6px;
      color: #eee;
      padding: 8px;
      outline: none;
      font-size: 0.95rem;
    }
    .form-input:focus {
      border-color: #ffb347;
    }
    .form-input.flex-2 { flex: 2; }
    .form-input.flex-1 { flex: 1; }
    .form-input.small { width: 110px; }
    .form-textarea {
      width: 100%;
      min-height: 60px;
      resize: vertical;
    }
    .btn-salvar {
      background: #ffb347;
      border: none;
      border-radius: 6px;
      padding: 8px 12px;
      font-weight: 600;
      cursor: pointer;
      color: #000;
      transition: 0.2s;
    }
    .btn-salvar:hover {
      background: #ffc766;
    }
    #productList {
      background: #1b1b1b;
      border-radius: 10px;
      padding: 10px;
      border: 1px solid #222;
    }
    .produto-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 6px;
      border-bottom: 1px solid #2a2a2a;
    }
    .produto-item:last-child { border-bottom: none; }
    .btn-del {
      background: none;
      border: none;
      color: #ff6666;
      font-size: 1.2rem;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-del:hover {
      transform: scale(1.2);
    }
  </style>
</head>

<body>

<header>
  <div class="menu-wrapper">
    <button class="menu-button" onclick="toggleMenu()">⋮</button>
    <div id="menuDropdown" class="menu-dropdown">
      <div onclick="window.location.href='index.html'">📙 Cardápio</div>
      <div onclick="window.location.href='meus-pedidos.html'">🧾 Meus pedidos</div>
      <div onclick="window.location.href='relatorio.html'">📈 Relatório</div>
      <div onclick="window.location.href='cozinha.html'">👨‍🍳 Cozinha</div>
      <div onclick="window.location.href='configuracoes.html'">⚙️ Configurações</div>
      <div onclick="abrirPainelEmpresa()">🏢 Painel da Empresa</div>
    </div>
  </div>
  <div class="header-title">⚙️ Configurações do Cardápio</div>
</header>

<main class="categories container">
  <h3 class="section-title">Adicionar Novo Prato</h3>

  <div class="form-row">
    <input type="text" id="newName" placeholder="Nome" class="form-input flex-2" />
    <input type="number" id="newPrice" placeholder="Preço" step="0.01" class="form-input small" />
    <input type="text" id="newCategory" placeholder="Categoria" class="form-input flex-1" />
  </div>

  <textarea id="newDescription" placeholder="Descrição do produto" class="form-input form-textarea"></textarea>

  <div style="margin-top:8px;">
    <button onclick="addProduct()" class="btn-salvar">Adicionar Produto</button>
  </div>

  <h3 class="section-title" style="margin-top:30px;">Pratos Cadastrados</h3>
  <div id="productList">Carregando produtos...</div>
</main>

<!-- 🔒 Auth SEM chamada direta -->
<script src="js/auth.js"></script>

<!-- Script da página (a segurança fica AQUI) -->
<script src="js/configuracoes.js"></script>

<!-- Painel da empresa -->
<script>
function abrirPainelEmpresa() {
  const user = JSON.parse(localStorage.getItem('user') || '{}');
  if (user.role === 'admin') {
    window.location.href = 'company-admin.html';
  } else {
    alert('Apenas o administrador da empresa pode acessar este painel.');
  }
}
</script>

<!-- Menu -->
<script>
function toggleMenu() {
  document.getElementById('menuDropdown').classList.toggle('show');
}

document.addEventListener('click', e => {
  if (!e.target.closest('.menu-wrapper')) {
    document.getElementById('menuDropdown').classList.remove('show');
  }
});
</script>

</body>
</html>
