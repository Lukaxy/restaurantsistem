<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Configurações - Cardápio ⚙️</title>
  
  <link rel="stylesheet" href="css/style.css" />

  <style>
    /* CSS DO TOGGLE SWITCH */
    .switch { position: relative; display: inline-block; width: 40px; height: 22px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: var(--bg-input); transition: .4s; border-radius: 34px; border: 1px solid var(--border-color); }
    .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 4px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
    input:checked + .slider { background-color: var(--color-green); border-color: var(--color-green); }
    input:checked + .slider:before { transform: translateX(18px); }

    /* ESTILO DO QR CODE */
    #qr-container { text-align: center; padding: 20px; background: var(--bg-input); border-radius: var(--radius); margin-top: 15px; border: 1px dashed var(--color-blue); }
    
    .menu-dropdown { display: none; position: absolute; background: #1a1d21; border: 1px solid var(--border-color); right: 30px; top: 60px; z-index: 100; }
    .menu-dropdown.show { display: block; }
    .menu-dropdown div { padding: 10px 20px; cursor: pointer; border-bottom: 1px solid #333; }
  </style>
</head>

<body>

<header>
  <div class="menu-wrapper">
    <button class="menu-button" onclick="toggleMenu()">⋮</button>
    <div id="menuDropdown" class="menu-dropdown">
      <div onclick="location.href='index.html'">Cardapio 📙</div>
      <div onclick="location.href='meus-pedidos.html'">Meus pedidos 🧾</div>
      <div onclick="location.href='relatorio.html'">Relatório 📈</div>
      <div onclick="window.location.href='bar.html'">Bar🍹</div>
      <div onclick="location.href='cozinha.html'">Cozinha 👨‍🍳</div>
      <div onclick="location.href='configuracoes.html'">Configurações ⚙️</div>
      <div onclick="location.href='company-admin.html'">Painel da Empresa 🏢</div>
      <div onclick="location.href='tutorial.html'">Tutoriais 📚</div>
      <div onclick="location.href='support.html'">Suporte 🛠️</div>
      <div onclick="logout()" style="color: var(--color-red);">Sair do Sistema 🚪</div>
    </div>
  </div>
  <div class="header-title">Configurações do Cardápio ⚙️</div>
</header>

<main>
    <div class="box">
        <h3 style="color: var(--color-amber); margin-bottom: 20px;">➕ Adicionar Novo Prato</h3>
        <div class="form-row">
            <input type="text" id="newName" placeholder="Nome do Prato" style="flex: 3;">
            <input type="number" id="newPrice" placeholder="R$ 0,00" step="0.01" style="flex: 1;">
            <input type="text" id="newCategory" placeholder="Categoria (ex: Bebidas)" style="flex: 1;">
        </div>
        <textarea id="newDescription" placeholder="Descrição do produto..." rows="3"></textarea>
        <select id="newDestination" style="flex: 1; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-input); color: white;">
            <option value="cozinha">🍳 Cozinha</option>
            <option value="bar">🍸 Bar / Copa</option>
        </select>
        <div style="margin-top: 10px;">
            <button onclick="addProduct()" class="btn success" style="width: 100%;">💾 Salvar Produto</button>
        </div>
    </div>

    </main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="js/auth.js"></script>
<script src="js/configuracoes.js" type="module"></script>

<script>
  // Funções globais de UI que não dependem da API
  function toggleMenu() { document.getElementById('menuDropdown').classList.toggle('show'); }
  document.addEventListener('click', e => { if (!e.target.closest('.menu-wrapper')) document.getElementById('menuDropdown').classList.remove('show'); });

  function showToast(mensagem, tipo = 'sucesso') {
      let container = document.getElementById('toast-container');
      if (!container) {
          container = document.createElement('div');
          container.id = 'toast-container';
          container.style.cssText = "position:fixed; top:20px; right:20px; z-index:10000;";
          document.body.appendChild(container);
      }
      const toast = document.createElement('div');
      toast.style.cssText = `background: #1a1a1a; color: white; padding: 15px 25px; border-radius: 10px; border-left: 4px solid ${tipo === 'sucesso' ? '#51cf66' : '#ff6b6b'}; box-shadow: 0 10px 30px rgba(0,0,0,0.5); margin-bottom: 10px; display: flex; align-items: center; gap: 10px; font-family: 'Poppins', sans-serif;`;
      toast.innerHTML = `<span>${tipo === 'sucesso' ? '✅' : '❌'}</span> <span>${mensagem}</span>`;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
  }
</script>
</body>
</html>
