<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Configurações - Cardápio ⚙️</title>
  
  <link rel="stylesheet" href="css/style.css" />

  <script>
    // === SEGURANÇA COM TOAST PERSONALIZADO ===
    (function () {
      const user = JSON.parse(localStorage.getItem("user") || "null");
      
      if (!user || user.role !== "admin") {
        // Cria o visual do erro na hora
        document.addEventListener("DOMContentLoaded", () => {
          // Injeta o CSS das animações se não existirem
          const style = document.createElement('style');
          style.innerHTML = `
            @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
            @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; transform: translateY(-20px); } }
          `;
          document.head.appendChild(style);

          // Mostra o Toast de Barrado
          let container = document.getElementById('toast-container');
          if (!container) {
            container = document.createElement('div');
            container.id = 'toast-container';
            container.style.cssText = "position:fixed; top:20px; right:20px; z-index:10000;";
            document.body.appendChild(container);
          }

          const toast = document.createElement('div');
          toast.style.cssText = `
            background: #1a1a1a; color: white; padding: 20px; border-radius: 12px; 
            border-left: 5px solid #ff6b6b; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex; align-items: center; gap: 15px; font-family: 'Poppins', sans-serif;
            animation: slideIn 0.5s ease forwards;
          `;
          toast.innerHTML = `
            <span style="font-size: 1.5rem;">🚫</span> 
            <div>
                <strong style="display:block;">Acesso Negado!</strong>
                <small>Área exclusiva para Admins. Voltando...</small>
            </div>
          `;
          container.appendChild(toast);

          // Expulsa o intruso após 2.5 segundos
          setTimeout(() => {
            window.location.replace("index.html");
          }, 2500);
        });
      }
    })();
  </script>
</head>

<body>

<header>
  <div class="menu-wrapper">
    <button class="menu-button" onclick="toggleMenu()">⋮</button>
    <div id="menuDropdown" class="menu-dropdown">
      <div onclick="window.location.href='index.html'">Cardápio 📙</div>
      <div onclick="window.location.href='meus-pedidos.html'">Meus pedidos 🧾</div>
      <div onclick="window.location.href='relatorio.html'">Relatório 📈</div>
      <div onclick="window.location.href='cozinha.html'">Cozinha 👨‍🍳</div>
      <div onclick="window.location.href='configuracoes.html'">Configurações ⚙️</div>
      <div onclick="location.href='company-admin.html'">Painel da Empresa  🏢</div>
      <div onclick="logout()" style="color: var(--color-red);">Sair do Sistema 🚪</div>
    </div>
  </div>
  <div class="header-title">Configurações do Cardápio ⚙️</div>
</header>

<style>   
  .menu-dropdown {
    display: none;
    position: absolute;
    background: #1a1d21;
    border: 1px solid var(--border-color);
    right: 30px;
    top: 60px;
    z-index: 100;
  }
  .menu-dropdown.show { display: block; }
  .menu-dropdown div { padding: 10px 20px; cursor: pointer; border-bottom: 1px solid #333; }
</style>

<main>
  <div class="box">
    <h3 style="color: var(--color-amber); margin-bottom: 20px;">➕ Adicionar Novo Prato</h3>

    <div class="form-row">
      <input type="text" id="newName" placeholder="Nome do Prato" style="flex: 3;">
      <input type="number" id="newPrice" placeholder="R$ 0,00" step="0.01" style="flex: 1;">
      <input type="text" id="newCategory" placeholder="Categoria (ex: Bebidas)" style="flex: 1;">
    </div>

    <textarea id="newDescription" placeholder="Descrição do produto (ex: Carne suculenta, queijo derretido...)" rows="3"></textarea>

    <div style="margin-top: 10px;">
      <button onclick="addProduct()" class="btn success" style="width: 100%;">💾 Salvar Produto</button>
    </div>
  </div>

  <div class="box" style="margin-top: 25px;">
    <h3 style="margin-bottom: 20px;">Pratos Cadastrados 📋</h3>
    <div id="productList">
       <p style="text-align: center; color: var(--text-secondary);">Carregando produtos...</p>
    </div>
  </div>
</main>

<script src="js/auth.js"></script>
<script src="js/configuracoes.js"></script>

<script>
  // === NOTIFICAÇÕES (TOAST) GLOBAIS ===
  function showToast(mensagem, tipo = 'sucesso') {
      let container = document.getElementById('toast-container');
      if (!container) {
          container = document.createElement('div');
          container.id = 'toast-container';
          container.style.cssText = "position:fixed; top:20px; right:20px; z-index:10000;";
          document.body.appendChild(container);
      }
      const toast = document.createElement('div');
      toast.style.cssText = `
          background: #1a1a1a; color: white; padding: 15px 25px; border-radius: 10px; 
          border-left: 4px solid ${tipo === 'sucesso' ? '#51cf66' : '#ff6b6b'};
          box-shadow: 0 10px 30px rgba(0,0,0,0.5); margin-bottom: 10px;
          display: flex; align-items: center; gap: 10px; font-family: 'Poppins', sans-serif;
          animation: slideIn 0.5s ease forwards;
      `;
      toast.innerHTML = `<span>${tipo === 'sucesso' ? '✅' : '❌'}</span> <span>${mensagem}</span>`;
      container.appendChild(toast);
      setTimeout(() => {
          toast.style.animation = "fadeOut 0.5s ease forwards";
          setTimeout(() => toast.remove(), 500);
      }, 3000);
  }

  // Interface
  function toggleMenu() {
    document.getElementById('menuDropdown').classList.toggle('show');
  }

  // Fecha menu ao clicar fora
  document.addEventListener('click', e => {
    if (!e.target.closest('.menu-wrapper')) {
      document.getElementById('menuDropdown').classList.remove('show');
    }
  });
</script>

<div id="confirmModal" class="modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:9999; justify-content:center; align-items:center;">
    <div class="box" style="max-width: 400px; text-align: center; padding: 30px;">
        <h3>Excluir Produto? 🗑️</h3>
        <p style="color: var(--text-secondary); margin: 15px 0;">Esta ação não pode ser desfeita. Deseja continuar?</p>
        <div style="display: flex; gap: 10px; margin-top: 20px;">
            <button id="confirmBtn" class="btn success" style="flex:1; background: var(--color-red);">Sim, Excluir</button>
            <button onclick="fecharConfirm()" class="btn cancel" style="flex:1;">Cancelar</button>
        </div>
    </div>
</div>  

</body>
</html>
