<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>⚙️ Configurações - Cardápio</title>
  
  <link rel="stylesheet" href="css/style.css" />

  <script>
    (function () {
      try {
        const user = JSON.parse(localStorage.getItem("user"));
        if (!user || user.role !== "admin") {
          alert("Apenas o administrador pode acessar este painel.");
          window.location.replace("index.html");
        }
      } catch {
        window.location.replace("index.html");
      }
    })();
  </script>
</head>

<body>

<header>
  <div class="menu-wrapper">
    <button class="menu-button" onclick="toggleMenu()">⋮</button>
    <div id="menuDropdown" class="menu-dropdown">
      <div onclick="window.location.href='index.html'">📙 Cardápio</div>
      <div onclick="window.location.href='meus-pedidos.html'">🧾 Meus pedidos</div>
      <div onclick="window.location.href='relatorio.html'">📈 Relatório</div>
      <div onclick="window.location.href='cozinha.html'">👨‍🍳 Cozinha</div>
      <div onclick="window.location.href='configuracoes.html'">⚙️ Configurações</div>
      <div onclick="abrirPainelEmpresa()">🏢 Painel da Empresa</div>
    </div>
  </div>
  <div class="header-title">⚙️ Configurações do Cardápio</div>
</header>

<main>
  <div class="box">
    <h3 style="color: var(--color-amber); margin-bottom: 20px;">➕ Adicionar Novo Prato</h3>

    <div class="form-row">
      <input type="text" id="newName" placeholder="Nome do Prato" style="flex: 3;">
      <input type="number" id="newPrice" placeholder="R$ 0,00" step="0.01" style="flex: 1;">
      <input type="text" id="newCategory" placeholder="Categoria (ex: Bebidas)" style="flex: 1;">
    </div>

    <textarea id="newDescription" placeholder="Descrição do produto (ex: Carne suculenta, queijo derretido...)" rows="3"></textarea>

    <div style="margin-top: 10px;">
      <button onclick="addProduct()" class="btn success" style="width: 100%;">💾 Salvar Produto</button>
    </div>
  </div>

  <div class="box" style="margin-top: 25px;">
    <h3 style="margin-bottom: 20px;">📋 Pratos Cadastrados</h3>
    <div id="productList">
       <p style="text-align: center; color: var(--text-secondary);">Carregando produtos...</p>
    </div>
  </div>
</main>

<script src="js/auth.js"></script>
<script src="js/configuracoes.js"></script>

<script>
  // Funções de Interface
  function toggleMenu() {
    document.getElementById('menuDropdown').classList.toggle('show');
  }

  function abrirPainelEmpresa() {
    const user = JSON.parse(localStorage.getItem('user') || '{}');
    if (user.role === 'admin') {
      window.location.href = 'company-admin.html';
    } else {
      alert('Apenas o administrador pode acessar este painel.');
    }
  }

  // Fecha menu ao clicar fora
  document.addEventListener('click', e => {
    if (!e.target.closest('.menu-wrapper')) {
      document.getElementById('menuDropdown').classList.remove('show');
    }
  });
</script>

</body>
</html>
