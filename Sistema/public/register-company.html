<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="img/icone.png">
  <title>🏢 Registrar Empresa - Digital Menu</title>
  
  <link rel="stylesheet" href="css/style.css" />
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh;">

  <div class="box" style="max-width: 400px; width: 90%;">
    <h2 style="text-align: center; color: var(--color-blue); margin-bottom: 10px;">🏢 Nova Empresa</h2>
    <p style="text-align: center; margin-bottom: 25px;">Cadastre seu estabelecimento no sistema.</p>

    <div style="display: flex; flex-direction: column; gap: 5px;">
      <label style="font-size: 0.85rem; color: var(--text-secondary);">Nome do Negócio</label>
      <input type="text" id="name" placeholder="Ex: Pizzaria do Zé" />

      <label style="font-size: 0.85rem; color: var(--text-secondary); margin-top: 10px;">E-mail Administrativo</label>
      <input type="email" id="email" placeholder="admin@empresa.com" />

      <label style="font-size: 0.85rem; color: var(--text-secondary); margin-top: 10px;">Whatsapp</label>
      <input type="text" id="whatsapp" placeholder="(00) 00000-0000" />

      <label style="font-size: 0.85rem; color: var(--text-secondary); margin-top: 10px;">Senha de Acesso</label>
      <input type="password" id="senha" placeholder="••••••••" />
    </div>

    <button class="btn success" onclick="register()" style="width: 100%; margin-top: 25px; padding: 15px;">
      🚀 Criar Empresa
    </button>

    <p id="msg" style="text-align: center; margin-top: 15px; font-weight: bold;"></p>

    <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 20px 0;">

    <p style="text-align: center; font-size: 0.9rem;">
      Já tem uma conta? <a href="login.html" style="font-weight: bold;">Fazer login</a>
    </p>
  </div>

  <script>
    async function register() {
      // Pega os elementos com segurança
      const nameInput = document.getElementById('name');
      const emailInput = document.getElementById('email');
      const whatsappInput = document.getElementById('whatsapp');
      const senhaInput = document.getElementById('senha');
      const msg = document.getElementById('msg');
      const btn = document.querySelector('button');

      const name = nameInput.value.trim();
      const email = emailInput.value.trim();
      const whatsapp = whatsappInput ? whatsappInput.value.trim() : ""; // Proteção contra erro
      const senha = senhaInput.value.trim();

      msg.textContent = '';

      if (!name || !email || !whatsapp || !senha) {
        msg.style.color = 'orange'; // Corrigido para cor padrão se a variavel nao existir
        msg.textContent = '⚠️ Preencha todos os campos.';
        return;
      }

      btn.disabled = true;
      btn.innerText = 'Processando...';

      try {
        const res = await fetch('/api/register-company', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          // AGORA ESTAMOS ENVIANDO TUDO QUE O BACKEND ESPERA
          body: JSON.stringify({ name, email, whatsapp, senha })
        });

        const data = await res.json();
        
        if (!data.ok) throw new Error(data.error || 'Erro ao registrar.');

        msg.style.color = 'green';
        msg.textContent = '✅ Empresa criada! Redirecionando...';
        
        // Salva o usuário para já entrar logado
        if (data.user) {
            localStorage.setItem('user', JSON.stringify(data.user));
        }
        
        setTimeout(() => (window.location.href = 'login.html'), 1500);

      } catch (err) {
        console.error(err);
        msg.style.color = 'red';
        msg.textContent = '❌ ' + err.message;
        btn.disabled = false;
        btn.innerText = '🚀 Criar Empresa';
      }
    }
  </script>
</body>
</html>
