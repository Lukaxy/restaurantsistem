<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="img/icone.png">
    <title>Registrar Empresa - Digital Menu 🏢</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-main: #F7F9FC;
            --bg-card: #FFFFFF;
            --bg-input: #EDF2F7;
            --color-blue: #2B6CB0;
            --color-green: #38A169;
            --color-red: #E53E3E;
            --color-amber: #D69E2E;
            --text-primary: #1A202C;
            --text-secondary: #718096;
            --border-color: #E2E8F0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .register-box {
            background: var(--bg-card);
            padding: 40px 30px;
            border-radius: 16px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border: 1px solid var(--border-color);
            animation: popIn 0.4s ease;
        }

        .register-header { text-align: center; margin-bottom: 25px; }
        .register-header h2 { color: var(--color-blue); margin-bottom: 5px; font-size: 1.8rem; }
        .register-header p { font-size: 0.95rem; color: var(--text-secondary); }

        .input-group { display: flex; flex-direction: column; text-align: left; margin-bottom: 18px; }
        .input-group label { font-size: 0.9rem; font-weight: 600; color: var(--text-primary); margin-bottom: 8px; display: block;}
        
        input {
            background: var(--bg-input); border: 1px solid var(--border-color);
            color: var(--text-primary); padding: 14px 15px; border-radius: 8px;
            font-family: inherit; font-size: 1rem; outline: none; width: 100%; transition: 0.2s;
        }
        input:focus { border-color: var(--color-blue); background: #FFF; box-shadow: 0 0 0 3px rgba(43, 108, 176, 0.1); }

        .btn {
            width: 100%; padding: 15px; border-radius: 8px; font-weight: bold; border: none; cursor: pointer; 
            font-family: inherit; font-size: 1.05rem; color: white; transition: 0.2s; background: var(--color-green);
            margin-top: 10px; display: flex; justify-content: center; align-items: center; gap: 8px;
        }
        .btn:hover { opacity: 0.9; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(56, 161, 105, 0.2); }
        .btn:disabled { background: var(--text-secondary); cursor: not-allowed; transform: none; box-shadow: none; }

        #msg { text-align: center; margin-top: 20px; font-weight: bold; min-height: 20px; font-size: 0.95rem; }

        .divider { border: 0; border-top: 1px solid var(--border-color); margin: 25px 0; }

        .footer-links { text-align: center; font-size: 0.95rem; color: var(--text-secondary); line-height: 1.6;}
        .footer-links a { color: var(--color-blue); font-weight: bold; text-decoration: none; transition: 0.2s; }
        .footer-links a:hover { color: #1A365D; text-decoration: underline; }

        @keyframes popIn { 0% { transform: scale(0.95); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    </style>

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-2BTBZ5MK63"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-2BTBZ5MK63');
    </script>
</head>
<body>

    <div class="register-box">
        <div class="register-header">
            <h2>Nova Empresa 🏢</h2>
            <p>Cadastre seu estabelecimento no sistema e comece a vender hoje mesmo.</p>
        </div>

        <div class="input-group">
            <label for="name">Nome do Negócio</label>
            <input type="text" id="name" placeholder="Ex: Pizzaria do Zé" autocomplete="organization" />
        </div>

        <div class="input-group">
            <label for="email">E-mail Administrativo</label>
            <input type="email" id="email" placeholder="admin@empresa.com" autocomplete="email" />
        </div>

        <div class="input-group">
            <label for="whatsapp">WhatsApp</label>
            <input type="tel" id="whatsapp" placeholder="(00) 00000-0000" autocomplete="tel" />
        </div>

        <div class="input-group">
            <label for="senha">Senha de Acesso</label>
            <input type="password" id="senha" placeholder="••••••••" autocomplete="new-password" />
        </div>

        <button class="btn" id="btn-register" onclick="register()">
            🚀 Criar Empresa
        </button>

        <p id="msg"></p>

        <hr class="divider">

        <div class="footer-links">
            Já tem uma conta? <a href="login.html">Fazer login</a>
        </div>
    </div>

    <script>
        async function register() {
            // Pega os elementos com segurança
            const nameInput = document.getElementById('name');
            const emailInput = document.getElementById('email');
            const whatsappInput = document.getElementById('whatsapp');
            const senhaInput = document.getElementById('senha');
            const msg = document.getElementById('msg');
            const btn = document.getElementById('btn-register');

            const name = nameInput.value.trim();
            const email = emailInput.value.trim();
            const whatsapp = whatsappInput ? whatsappInput.value.trim() : ""; 
            const senha = senhaInput.value.trim();

            msg.textContent = '';

            if (!name || !email || !whatsapp || !senha) {
                msg.style.color = 'var(--color-amber)';
                msg.textContent = '⚠️ Preencha todos os campos.';
                
                // Animação de erro no botão
                btn.style.transform = "translateX(-5px)";
                setTimeout(() => btn.style.transform = "translateX(5px)", 100);
                setTimeout(() => btn.style.transform = "translateX(0)", 200);
                return;
            }

            btn.disabled = true;
            const originalText = btn.innerHTML;
            btn.innerHTML = '⏳ Processando...';

            try {
                const res = await fetch('/api/register-company', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, whatsapp, senha })
                });

                const data = await res.json();
                
                if (!data.ok) throw new Error(data.error || 'Erro ao registrar.');

                msg.style.color = 'var(--color-green)';
                msg.textContent = '✅ Empresa criada! Redirecionando...';
                
                btn.innerHTML = 'Sucesso! 🎉';
                btn.style.background = 'var(--color-blue)'; // Muda cor pra dar sensação de sucesso
                
                // Salva o usuário para já entrar logado
                if (data.user) {
                    localStorage.setItem('user', JSON.stringify(data.user));
                    // Se já fez login automático, é melhor mandar direto pro painel:
                    setTimeout(() => (window.location.href = 'index.html'), 1500);
                } else {
                    // Se a API não devolver o user, manda pro login
                    setTimeout(() => (window.location.href = 'login.html'), 1500);
                }

            } catch (err) {
                console.error(err);
                msg.style.color = 'var(--color-red)';
                msg.textContent = '❌ ' + err.message;
                
                btn.disabled = false;
                btn.innerHTML = originalText;
                
                // Animação de erro no botão
                btn.style.transform = "translateX(-5px)";
                setTimeout(() => btn.style.transform = "translateX(5px)", 100);
                setTimeout(() => btn.style.transform = "translateX(0)", 200);
            }
        }

        // Atalho do teclado (Apertar Enter no último campo)
        document.getElementById('senha').addEventListener('keydown', e => {
            if (e.key === 'Enter') register();
        });
    </script>
</body>
</html>
