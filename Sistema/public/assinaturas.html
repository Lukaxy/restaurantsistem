<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planos & Preços - Digital Menu 🚀</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-main: #0d0d0d;
      --bg-card: #1a1a1a;
      --color-blue: #339af0;
      --color-green: #51cf66;
      --color-purple: #845ef7; /* Cor especial para o Vitalício */
      --text-primary: #ffffff;
      --text-secondary: #adb5bd;
      --border-color: #2c2f33;
    }

    * { box-sizing: border-box; }

    body {
      font-family: "Poppins", sans-serif;
      background: var(--bg-main);
      color: var(--text-primary);
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    header {
      text-align: center;
      padding: 60px 20px 40px;
    }

    h1 {
      font-size: 2.5rem;
      margin: 0 0 10px;
      background: linear-gradient(90deg, #fff, #339af0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.subtitle {
      color: var(--text-secondary);
      font-size: 1.1rem;
      max-width: 600px;
      margin: 0 auto;
    }

    /* GRID DE PLANOS */
    .plans-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 30px;
      padding: 20px;
      max-width: 1200px;
      width: 100%;
    }

    .plan-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 40px 30px;
      width: 320px;
      text-align: center;
      position: relative;
      transition: transform 0.3s ease, border-color 0.3s ease;
      display: flex;
      flex-direction: column;
    }

    .plan-card:hover {
      transform: translateY(-10px);
      border-color: var(--color-blue);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    /* DESTAQUE (Card do meio) */
    .plan-card.popular {
      border: 2px solid var(--color-blue);
      box-shadow: 0 0 20px rgba(51, 154, 240, 0.15);
      transform: scale(1.05); /* Um pouco maior que os outros */
    }
    .plan-card.popular:hover {
      transform: scale(1.05) translateY(-10px);
    }

    .badge {
      position: absolute;
      top: -15px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--color-blue);
      color: white;
      padding: 8px 20px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .plan-name {
      font-size: 1.5rem;
      margin-bottom: 10px;
      color: var(--text-primary);
    }

    .price {
      font-size: 3rem;
      font-weight: 700;
      margin: 20px 0;
      color: white;
    }
    .price span {
      font-size: 1rem;
      color: var(--text-secondary);
      font-weight: 400;
    }

    ul.features {
      list-style: none;
      padding: 0;
      margin: 0 0 30px;
      flex-grow: 1; /* Empurra o botão para baixo */
      text-align: left;
    }

    ul.features li {
      margin-bottom: 15px;
      color: #ccc;
      display: flex;
      align-items: center;
    }

    ul.features li::before {
      content: "✔";
      display: inline-block;
      width: 20px;
      height: 20px;
      background: rgba(81, 207, 102, 0.2);
      color: var(--color-green);
      border-radius: 50%;
      text-align: center;
      line-height: 20px;
      font-size: 12px;
      margin-right: 10px;
    }

    /* BOTÕES */
    .btn-plan {
      display: block;
      width: 100%;
      padding: 15px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      transition: 0.3s;
      margin-top: auto;
    }

    .btn-outline {
      border: 1px solid var(--border-color);
      color: white;
      background: transparent;
    }
    .btn-outline:hover {
      border-color: white;
      background: rgba(255,255,255,0.05);
    }

    .btn-primary {
      background: var(--color-blue);
      color: white;
      border: none;
      box-shadow: 0 4px 15px rgba(51, 154, 240, 0.4);
    }
    .btn-primary:hover {
      background: #228be6;
      transform: scale(1.02);
    }
