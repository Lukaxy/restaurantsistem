<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Painel do Bar 🍸</title>
  <link rel="stylesheet" href="css/style.css" />
  
  <script src="js/auth.js"></script>
  <style>
    .menu-dropdown {
      display: none;
      position: absolute;
      background: #1a1d21;
      border: 1px solid var(--border-color);
      right: 30px;
      top: 60px;
      z-index: 100;
    }
    .menu-dropdown.show { display: block; }
    .menu-dropdown div { padding: 10px 20px; cursor: pointer; border-bottom: 1px solid #333; }
    
    .order-card { height: auto; flex-direction: column; display: flex; background: var(--bg-card); padding: 15px; margin-bottom: 15px; border-radius: 12px; border: 1px solid var(--border-color); }
    .order-header { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 10px; color: #d63384; }
    .order-item { padding: 5px 0; border-bottom: 1px solid #3a3f44; color: var(--text-primary); }
    .order-obs { color: #fcc419; font-size: 0.9em; margin-top: 2px; }
    
    /* Novo layout para os botões ficarem lado a lado */
    .button-group { display: flex; gap: 10px; margin-top: 10px; }
    .btn-action { width: 100%; padding: 10px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; }
    
    .btn-accept { background: #d63384; color: white; }
    .btn-ready { background: var(--color-green); color: white; }
    
    /* Estilo do novo botão de cancelar */
    .btn-cancel { background: #fa5252; color: white; }
    .btn-cancel:hover { background: #e03131; }
  </style>
</head>

<body>

<header>
  <div class="menu-wrapper">
    <button class="menu-button" onclick="toggleMenu()">⋮</button>
    <div id="menuDropdown" class="menu-dropdown">
      <div onclick="location.href='index.html'">Cardapio 📙</div>
      <div onclick="location.href='meus-pedidos.html'">Meus pedidos 🧾</div>
      <div onclick="location.href='relatorio.html'">Relatório 📈</div>
      <div onclick="window.location.href='bar.html'">Bar🍹</div>
      <div onclick="location.href='cozinha.html'">Cozinha 👨‍🍳</div>
      <div onclick="location.href='configuracoes.html'">Configurações ⚙️</div>
      <div onclick="location.href='company-admin.html'">Painel da Empresa 🏢</div>
      <div onclick="location.href='tutorial.html'">Tutoriais 📚</div>
      <div onclick="location.href='support.html'">Suporte 🛠️</div>
      <div onclick="logout()" style="color: var(--color-red);">Sair do Sistema 🚪</div>
    </div>
  </div>
  <div class="header-title">Painel do Bar 🍸</div>
</header>

<main>
  <div id="orders">
     <p style="text-align:center; margin-top: 20px; color: #adb5bd;">Aguardando bebidas...</p>
  </div>
</main>

<script>
const ordersDiv = document.getElementById("orders");
const user = JSON.parse(localStorage.getItem("user"));

setInterval(loadOrders, 5000);
loadOrders();

async function loadOrders() {
    if (!user || !user.company_id) return;

    try {
        const res = await fetch(`/api/orders?company_id=${user.company_id}`);
        const data = await res.json();
        
        if (!data.ok) return;

        const activeOrders = data.pedidos.filter(p => {
            const statusB = p.status_bar || 'novo'; 
            return statusB === 'novo' || statusB === 'preparando';
        });

        if(activeOrders.length === 0) {
            ordersDiv.innerHTML = '<p style="text-align:center; margin-top: 50px; color: #adb5bd;">Bar tranquilo!</p>';
            return;
        }

        ordersDiv.innerHTML = "";

        activeOrders.forEach(order => {
            const itemsToShow = order.items.filter(item => item.destination === 'bar');
            if (itemsToShow.length === 0) return; 

            const currentStatus = order.status_bar || 'novo';

            // VERIFICAÇÃO DE COZINHA PENDENTE
            const temCozinha = order.items.some(item => item.destination !== 'bar');
            const cozinhaPendente = temCozinha && (order.status_cozinha === 'novo' || order.status_cozinha === 'preparando');

            const card = document.createElement("div");
            card.className = "order-card";
            const statusColor = currentStatus === 'novo' ? '#d63384' : '#51cf66';
            card.style.borderLeft = `5px solid ${statusColor}`;

            let itemsHtml = itemsToShow.map(item => `
                <div class="order-item">
                    <span style="font-weight:bold;">${item.qty || '1'}x</span> ${item.name}
                    ${item.notes ? `<div class="order-obs">⚠️ ${item.notes}</div>` : ''}
                </div>
            `).join("");

            // Construção dos Botões
            let primaryBtn = "";
            let cancelBtn = `<button class="btn-action btn-cancel" onclick="cancelarPedido(${order.id})">Cancelar ❌</button>`;
            
            if (currentStatus === 'novo') {
                primaryBtn = `<button class="btn-action btn-accept" onclick="processarBar(${order.id}, 'preparando')">🍸 Preparar</button>`;
            } else if (currentStatus === 'preparando') {
                primaryBtn = `<button class="btn-action btn-ready" onclick="processarBar(${order.id}, 'pronto')">✅ Pronto</button>`;
            }

            // Agrupa os botões
            let btnHtml = `
                <div class="button-group">
                    ${primaryBtn}
                    ${cancelBtn}
                </div>
            `;

            card.innerHTML = `
                <div class="order-header">
                    <span>${order.table_name || 'Balcão'}</span>
                    <span>#${order.id}</span>
                </div>
                <div style="margin-bottom:10px; font-size:0.8rem; color:#888;">
                    ⏰ ${new Date(order.created_at).toLocaleTimeString().substring(0,5)}
                    ${cozinhaPendente ? '<span style="float:right; color:#339af0;">Cozinha em preparo... 🍳</span>' : ''}
                </div>
                ${itemsHtml}
                ${btnHtml}
            `;
            ordersDiv.appendChild(card);
        });

    } catch (err) { console.error(err); }
}

// FUNÇÃO INTELIGENTE DO BAR (Agora o servidor faz o trabalho pesado)
async function processarBar(id, novoStatus) {
    try {
        // Envia apenas o status do Bar para o servidor. O servidor calcula o global.
        await fetch(`/api/orders/${id}/status-sector`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ sector: 'bar', status: novoStatus })
        });

        loadOrders();
    } catch (e) { 
        console.error(e);
        alert("Erro ao atualizar o bar."); 
    }
}

// Nova função para cancelar o pedido
async function cancelarPedido(id) {
    const confirmacao = confirm("Tem certeza que deseja CANCELAR este pedido? Essa ação não pode ser desfeita.");
    
    if (!confirmacao) return;

    const btn = event.target;
    const originalText = btn.innerHTML;
    btn.innerHTML = "...";
    btn.disabled = true;

    try {
        // Envia apenas o cancelamento do Bar para o servidor.
        await fetch(`/api/orders/${id}/status-sector`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ sector: 'bar', status: 'cancelado' })
        });
        
        loadOrders();
    } catch (e) {
        console.error(e);
        alert("Erro ao cancelar o pedido.");
        btn.innerHTML = originalText;
        btn.disabled = false;
    }
}

function toggleMenu() { document.getElementById("menuDropdown").classList.toggle("show"); }
document.addEventListener("click", e => { if (!e.target.closest(".menu-wrapper")) document.getElementById("menuDropdown").classList.remove("show"); });
</script>

</body>
</html>
