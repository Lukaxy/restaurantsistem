<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login do Administrador Master</title>
  <link rel="stylesheet" href="css/admin-login.css">
</head>
<body>
  <div class="login-box">
    <h1>🔑 Painel Master</h1>
    <input type="email" id="email" placeholder="E-mail">
    <input type="password" id="senha" placeholder="Senha">
    <button onclick="loginAdmin()">Entrar</button>
    <p id="msg"></p>
  </div>

  <script>
  async function loginAdmin() {
    const email = document.getElementById("email").value.trim();
    const senha = document.getElementById("senha").value.trim();
    const msg = document.getElementById("msg");
    msg.textContent = "";
    msg.style.color = "#ff6b00";

    if (!email || !senha) {
      msg.textContent = "Preencha todos os campos.";
      return;
    }

    try {
      const res = await fetch("/api/admin-login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, senha })
      });

      const text = await res.text();
      if (text.trim().startsWith("<")) {
        throw new Error("Servidor retornou HTML — verifique se o backend está ativo.");
      }

      let data;
      try {
        data = JSON.parse(text);
      } catch {
        throw new Error("Resposta inválida do servidor. (" + text.slice(0, 100) + ")");
      }

      if (!data.ok) throw new Error(data.error || "E-mail ou senha incorretos.");

      // 🔐 Salva apenas o usuário master no localStorage (sem token)
      localStorage.setItem("user", JSON.stringify({ ...data.user, role: "master" }));

      msg.style.color = "lightgreen";
      msg.textContent = "✅ Login realizado! Redirecionando...";

      setTimeout(() => window.location.href = "admin.html", 800);

    } catch (err) {
      console.error("Erro no login master:", err);
      msg.style.color = "red";
      msg.textContent = "❌ " + err.message;
    }
  }

  // Pressionar Enter também envia o formulário
  document.addEventListener("keydown", e => {
    if (e.key === "Enter") loginAdmin();
  });
  </script>
</body>
</html>
