<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="img/icone.png">
  <title>Login Master - Sistema de Cardápio</title>
  
  <link rel="stylesheet" href="css/style.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background: radial-gradient(circle, #1a1d21 0%, #000 100%);">

  <div class="box" style="max-width: 350px; width: 90%; border-top: 4px solid var(--color-blue); padding: 30px;">
    <div style="text-align: center; margin-bottom: 25px;">
        <h1 style="font-size: 1.5rem; color: var(--text-primary); margin-bottom: 10px;">Painel Master 🔑</h1>
        <p style="font-size: 0.85rem; color: var(--text-secondary);">Acesso restrito ao desenvolvedor</p>
    </div>

    <div style="display: flex; flex-direction: column; gap: 15px;">
        <div>
            <label style="font-size: 0.8rem; color: var(--text-secondary); display: block; margin-bottom: 5px;">E-mail Administrativo</label>
            <input type="email" id="email" placeholder="email@admin.com" style="margin-bottom: 0;">
        </div>
        
        <div>
            <label style="font-size: 0.8rem; color: var(--text-secondary); display: block; margin-bottom: 5px;">Senha Secreta</label>
            <input type="password" id="senha" placeholder="••••••••" style="margin-bottom: 0;">
        </div>
        
        <button class="btn success" onclick="loginAdmin()" style="width: 100%; margin-top: 10px; padding: 12px;">
            Entrar no Sistema
        </button>
    </div>

    <p id="msg" style="text-align: center; margin-top: 20px; font-weight: bold; min-height: 20px;"></p>
  </div>

  <script>
  async function loginAdmin() {
    const email = document.getElementById("email").value.trim();
    const senha = document.getElementById("senha").value.trim();
    const msg = document.getElementById("msg");
    const btn = document.querySelector('button');

    msg.textContent = "";

    if (!email || !senha) {
      msg.style.color = "var(--color-amber)";
      msg.textContent = "⚠️ Preencha todos os campos. ⚠️";
      return;
    }

    // Feedback visual
    btn.disabled = true;
    btn.innerText = "Verificando...";

    try {
      const res = await fetch("/api/admin-login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, senha })
      });

      const text = await res.text();
      
      // Proteção contra servidor offline ou rotas erradas
      if (text.trim().startsWith("<")) {
        throw new Error("Servidor retornou HTML — Verifique o backend.");
      }

      let data;
      try {
        data = JSON.parse(text);
      } catch {
        throw new Error("Resposta inválida do servidor.");
      }

      if (!data.ok) throw new Error(data.error || "Acesso negado.");

      // 🔐 Salva o usuário master
      localStorage.setItem("user", JSON.stringify({ ...data.user, role: "master" }));

      msg.style.color = "var(--color-green)";
      msg.textContent = "Login realizado! Entrando... ✅";

      // Redireciona para o painel de gerenciamento de empresas
      setTimeout(() => window.location.href = "admin.html", 800);

    } catch (err) {
      console.error("Erro no login master:", err);
      msg.style.color = "var(--color-red)";
      msg.textContent = "❌ " + err.message;
      btn.disabled = false;
      btn.innerText = "Entrar no Sistema";
    }
  }

  // Pressionar Enter também envia o formulário
  document.addEventListener("keydown", e => {
    if (e.key === "Enter") loginAdmin();
  });
  </script>
</body>
</html>
