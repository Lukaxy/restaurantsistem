<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel da Empresa 🏢</title>
  
  <link rel="stylesheet" href="css/style.css">

  <style>
    .menu-dropdown {
      display: none;
      position: absolute;
      background: #1a1d21;
      border: 1px solid var(--border-color);
      left: 15px;
      top: 50px;
      z-index: 1100;
      min-width: 200px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .menu-dropdown.show { display: block; }
    .menu-dropdown div { padding: 12px 20px; cursor: pointer; border-bottom: 1px solid #333; font-size: 0.9rem; }
    .menu-dropdown div:hover { background: var(--bg-card); }

    .status-plan-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 15px 20px;
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 25px;
      border-left: 5px solid var(--color-blue);
    }
    .status-icon { font-size: 1.8rem; }
    .status-label { font-size: 0.8rem; color: var(--text-secondary); margin: 0; }
    .status-timer { margin-left: auto; text-align: center; border-left: 1px solid var(--border-color); padding-left: 15px; }
    .status-timer span { display: block; font-size: 1.4rem; font-weight: bold; color: var(--color-blue); }
  </style>

  <script type="module">
    import { api } from "./js/http.js";

    // Reutilizando sua função Toast para manter o padrão
    function showToast(mensagem, tipo = 'sucesso') {
        let container = document.getElementById('toast-container');
        if (!container) {
            container = document.createElement('div');
            container.id = 'toast-container';
            container.style.cssText = "position:fixed; top:20px; right:20px; z-index:10000;";
            document.body.appendChild(container);
        }
        const toast = document.createElement('div');
        toast.style.cssText = `
            background: #1a1a1a; color: white; padding: 15px 25px; border-radius: 10px; 
            border-left: 4px solid ${tipo === 'sucesso' ? '#51cf66' : '#ff6b6b'};
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); margin-bottom: 10px;
            display: flex; align-items: center; gap: 10px; font-family: 'Poppins', sans-serif;
            animation: slideIn 0.5s ease forwards;
        `;
        toast.innerHTML = `<span>${tipo === 'sucesso' ? '✅' : '❌'}</span> <span>${mensagem}</span>`;
        container.appendChild(toast);
        setTimeout(() => {
            toast.style.animation = "fadeOut 0.5s ease forwards";
            setTimeout(() => toast.remove(), 500);
        }, 3000);
    }

    const user = JSON.parse(localStorage.getItem("user") || "{}");
    let idUsuarioParaExcluir = null;

    if (!user || user.role !== "admin") {
        window.location.href = "login.html";
    }

    // ======== LISTAR USUÁRIOS ========
    async function carregarUsuarios() {
        const list = document.getElementById("users-list");
        list.innerHTML = "<p style='text-align:center;'>Buscando equipe...</p>";
        try {
            const data = await api(`/api/users?company_id=${user.company_id}`);
            if (!data.ok) throw new Error(data.error || "Erro ao carregar");
            
            list.innerHTML = data.users.map(u => `
                <div style="display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid var(--border-color); gap: 10px;">
                    <div>
                        <strong>${u.name}</strong> <br>
                        <small>${u.email}</small> 
                        <span style="font-size: 0.7rem; background: var(--bg-main); padding: 2px 6px; border-radius: 4px; color: var(--color-blue); margin-left: 5px;">${u.role}</span>
                    </div>
                    ${u.role !== "admin" ? `<button class="btn cancel" onclick="prepararExclusao(${u.id})">🗑️</button>` : `<small style="color:var(--color-amber);">Admin</small>`}
                </div>
            `).join("");
        } catch (err) { 
            showToast(err.message, 'erro');
        }
    }

    // ======== ADICIONAR USUÁRIO ========
    async function addUser() {
        const name = document.getElementById("name").value.trim();
        const email = document.getElementById("email").value.trim();
        const senha = document.getElementById("senha").value.trim();
        const role = document.getElementById("role").value;

        if (!name || !email || !senha) {
            showToast("⚠️ Preencha todos os campos.", "erro");
            return;
        }

        try {
            const data = await api("/api/users", {
                method: "POST",
                body: JSON.stringify({ company_id: user.company_id, name, email, senha, role }),
            });
            if (!data.ok) throw new Error(data.error || "Erro ao adicionar.");
            
            showToast("Funcionário cadastrado! 🚀");
            document.getElementById("name").value = "";
            document.getElementById("email").value = "";
            document.getElementById("senha").value = "";
            carregarUsuarios();
        } catch (err) { 
            showToast(err.message, "erro"); 
        }
    }

    // ======== MODAL DE EXCLUSÃO ========
    window.prepararExclusao = (id) => {
        idUsuarioParaExcluir = id;
        document.getElementById('confirmModal').style.display = 'flex';
    };

    window.fecharConfirm = () => {
        document.getElementById('confirmModal').style.display = 'none';
        idUsuarioParaExcluir = null;
    };

    // ======== LOGOUT E MENU ========
    window.logout = () => { localStorage.clear(); window.location.href = "login.html"; };
    window.toggleMenu = (e) => { 
        if (e) e.stopPropagation();
        document.getElementById("menuDropdown").classList.toggle("show"); 
    };

    // Inicialização
    document.addEventListener("DOMContentLoaded", () => {
        carregarUsuarios();
        
        // Configura o botão do Modal
        document.getElementById('confirmBtn').onclick = async () => {
            if (!idUsuarioParaExcluir) return;
            try {
                await api(`/api/users/${idUsuarioParaExcluir}`, { method: "DELETE" });
                showToast("Removido com sucesso! 🗑️");
                fecharConfirm();
                carregarUsuarios();
            } catch (err) { showToast(err.message, "erro"); }
        };
    });

    // Expondo funções para o HTML
    window.addUser = addUser;
</script>
</head>

<body>  
  <header class="main-header" style="display: flex; align-items: center; justify-content: space-between; padding: 10px 15px; background: #212529; min-height: 60px;">
    <div class="menu-wrapper" style="flex: 1; display: flex; justify-content: flex-start;">
      <button class="menu-button" onclick="toggleMenu(event)">⋮</button>
      <div id="menuDropdown" class="menu-dropdown">
        <div onclick="window.location.href='index.html'">📙 Voltar ao Cardápio</div>
        <div onclick="window.location.href='meus-pedidos.html'">🧾 Meus pedidos</div>
        <div onclick="window.location.href='relatorio.html'">📈 Relatório</div>
        <div onclick="window.location.href='cozinha.html'">👨‍🍳 Cozinha</div>
        <div onclick="window.location.href='configuracoes.html'">⚙️ Configurações</div>
        <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 5px 0;">
        <div onclick="logout()" style="color: var(--color-red);">🚪 Sair do Sistema</div>
      </div>
    </div>

    <div class="header-title" style="flex: 1; text-align: center; font-weight: bold; font-size: 1.1rem; white-space: nowrap;">
      Gestão da Empresa 🏢
    </div>

    <div class="header-actions" style="flex: 1; display: flex; justify-content: flex-end;">
        <button id="btn-assinatura" class="btn" style="display: none; background: #845ef7; color: white; border: none; padding: 8px 12px; border-radius: 8px; font-weight: bold; cursor: pointer;" onclick="window.location.href='assinaturas.html'">
          Assinatura 💎
        </button>
    </div>
  </header>

  <main style="padding: 10px;">
    <div class="status-plan-card" id="plano-card">
      <div class="status-icon" id="plano-emoji">💎</div>
      <div class="status-details">
        <p class="status-label">Status da Assinatura</p>
        <h4 id="plano-nome" style="margin:0;">Carregando...</h4>
      </div>
      <div class="status-timer">
        <span id="plano-dias">--</span>
        <small>dias restantes</small>
      </div>
    </div>

    <div class="box">
      <h3 style="color: var(--color-blue); margin-bottom: 20px; text-align: center;">➕ Cadastrar Funcionário</h3>
      <div class="form-row" style="display: flex; flex-direction: column; gap: 10px;">
        <input id="name" placeholder="Nome Completo">
        <select id="role" style="padding: 12px;">
            <option value="atendente">Atendente 🙋‍♂️</option>
            <option value="cozinha">Cozinha 👨‍🍳</option>
            <option value="admin">Admin 🔑</option>
        </select>
        <input id="email" placeholder="E-mail" type="email">
        <input id="senha" placeholder="Senha" type="password">
      </div>
      <button class="btn success" onclick="addUser()" style="width: 100%; margin-top: 20px; padding: 15px;">Confirmar Cadastro</button>
      <p id="msg" style="margin-top:10px; text-align: center; font-weight: bold;"></p>
    </div>

    <div class="box" style="margin-top: 25px;">
      <h3 style="margin-bottom: 20px; text-align: center;">Equipe Atual 👥</h3>
      <div id="users-list"></div>
    </div>
  </main>

  <div id="confirmModal" class="modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:9999; justify-content:center; align-items:center;">
    <div class="box" style="max-width: 400px; text-align: center; padding: 30px;">
        <h3>Remover Funcionário? 👤</h3>
        <p style="color: var(--text-secondary); margin: 15px 0;">O acesso deste usuário será revogado. Deseja continuar?</p>
        <div style="display: flex; gap: 10px; margin-top: 20px;">
            <button id="confirmBtn" class="btn success" style="flex:1; background: var(--color-red);">Remover</button>
            <button onclick="fecharConfirm()" class="btn cancel" style="flex:1;">Cancelar</button>
        </div>
    </div>
</div>
</body>
</html>
