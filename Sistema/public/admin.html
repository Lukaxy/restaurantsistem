<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <link rel="icon" type="image/png" href="img/icone.png">
  <title>Painel Master - Digital Menu 👑</title>
  
  <style>
    :root {
      --bg-main: #0d0d0d;
      --bg-box: #1a1a1a;
      --color-blue: #339af0;
      --color-green: #51cf66;
      --color-red: #ff6b6b;
      --color-amber: #fcc419;
      --text-primary: #ffffff;
      --text-secondary: #adb5bd;
      --border-color: #2c2f33;
    }

    body {
      font-family: "Poppins", sans-serif;
      background: var(--bg-main);
      color: var(--text-primary);
      margin: 0; padding: 0;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1e1e1e;
      padding: 15px 20px;
      border-bottom: 2px solid var(--color-blue);
    }

    main { padding: 15px; max-width: 1100px; margin: 0 auto; }

    /* --- AJUSTE MOBILE (FIX DE LAYOUT) --- */
    @media (max-width: 600px) {
      .form-row { flex-direction: column; }
      input, select { width: 100% !important; min-width: unset !important; }
      .box-empresa-header { flex-direction: column; gap: 10px; }
      .actions-row { flex-wrap: wrap; justify-content: center; }
      .btn.action { flex: 1; text-align: center; min-width: 80px; }
    }

    .box {
      background: var(--bg-box);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      margin-bottom: 20px;
      transition: 0.3s;
    }

    .form-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px; }
    
    input, select {
      flex: 1; padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: #2b2b2b;
      color: white;
    }

    .btn {
      border: none; padding: 12px 20px;
      border-radius: 8px; cursor: pointer;
      font-weight: bold; color: white; transition: 0.3s;
    }
    .btn.success { background: var(--color-green); width: 100%; }
    .btn.cancel { background: var(--color-red); }
    .btn.action { 
        background: #2b2b2b; font-size: 0.85rem; padding: 8px 12px; 
        display: flex; align-items: center; gap: 5px; border: 1px solid #444;
    }
    
    .badge {
      font-size: 0.7rem; padding: 3px 8px;
      border-radius: 4px; text-transform: uppercase; font-weight: bold;
    }
    
    .actions-row { margin-top: 15px; display: flex; gap: 8px; }

    /* --- TOAST & MODAL ANIMATION --- */
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    @keyframes popIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  </style>

  <script type="module">
    import { api } from "./js/http.js";

    // --- VARIÁVEIS DE ESTADO ---
    const user = JSON.parse(localStorage.getItem("user") || "{}");
    let empresaAlvoID = null;

    // --- SEGURANÇA ---
    if (!user || user.role !== "master") {
      window.location.href = "admin-login.html";
    }

    // --- FUNÇÕES DE INTERFACE (SUBSTITUINDO ALERTS) ---
    function showToast(msg, tipo = 'sucesso') {
      let container = document.getElementById("toast-container");
      if (!container) {
        container = document.createElement("div");
        container.id = "toast-container";
        container.style.cssText = "position:fixed; top:20px; right:20px; z-index:10000;";
        document.body.appendChild(container);
      }
      const toast = document.createElement("div");
      toast.style.cssText = `background:#1a1a1a; color:white; padding:15px 25px; border-radius:10px; border-left:4px solid ${tipo === 'sucesso' ? '#51cf66' : '#ff6b6b'}; box-shadow:0 10px 30px rgba(0,0,0,0.5); margin-bottom:10px; animation:slideIn 0.4s ease forwards;`;
      toast.innerHTML = msg;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }

    // --- CARREGAR DADOS ---
    async function carregarEmpresas() {
      const list = document.getElementById("empresas-list");
      try {
        const data = await api("/api/empresas");
        document.getElementById("total-count").textContent = data.empresas.length;
        
        list.innerHTML = data.empresas.map(e => {
          const expira = new Date(e.trial_expires_at || e.data_vencimento || new Date()); 
          const isExpirado = expira < new Date();
          const statusColor = e.plano === 'vitalicio' ? "var(--color-blue)" : isExpirado ? "var(--color-red)" : "var(--color-green)";

          return `
            <div class="box" style="border-left: 5px solid ${statusColor}">
              <div class="box-empresa-header" style="display: flex; justify-content: space-between; align-items: flex-start;">
                <div style="flex: 1;">
                  <strong style="font-size: 1.1em">${e.name}</strong> 
                  <span class="badge" style="background:${statusColor}; color: #000;">${e.plano}</span>
                  <div style="margin-top: 8px; color: var(--text-secondary); font-size: 0.85em; line-height: 1.5;">
                    📧 ${e.email_admin} <br>
                    📱 ${e.whatsapp || '---'} <br>
                    📅 Validade: <strong>${expira.toLocaleDateString()}</strong>
                  </div>
                </div>
                <div style="text-align: right;">
                    <select onchange="window.alterarPlano(${e.id}, this.value)" style="padding: 5px; font-size: 0.8rem; width: auto;">
                        <option value="trial" ${e.plano === 'trial' ? 'selected' : ''}>Teste</option>
                        <option value="basic" ${e.plano === 'basic' ? 'selected' : ''}>Pago</option>
                        <option value="vitalicio" ${e.plano === 'vitalicio' ? 'selected' : ''}>VIP</option>
                    </select>
                </div>
              </div>
              <div class="actions-row">
                <button class="btn action" onclick="window.logarComo(${e.id}, '${e.name}')">🔑 Entrar</button>
                <button class="btn action" onclick="window.abrirModalDias(${e.id})">📅 + Dias</button>
                <button class="btn action cancel" onclick="window.abrirModalExcluir(${e.id})" style="padding: 8px 10px;">🗑️</button>
              </div>
            </div>
          `;
        }).join("");
      } catch (err) { showToast("Erro ao carregar dados", "erro"); }
    }

    // --- MODAIS CUSTOMIZADOS (SEM PROMPTS) ---
    window.abrirModalDias = (id) => {
        empresaAlvoID = id;
        document.getElementById('modalDias').style.display = 'flex';
    };

    window.abrirModalExcluir = (id) => {
        empresaAlvoID = id;
        document.getElementById('modalExcluir').style.display = 'flex';
    };

    window.adicionarDias = async () => {
        const dias = document.getElementById('inputDias').value;
        if (!dias) return;
        const res = await api(`/api/empresas/${empresaAlvoID}/add-days`, { method: "POST", body: JSON.stringify({ dias: parseInt(dias) }) });
        if (res.ok) {
            showToast("Dias adicionados! 📅");
            carregarEmpresas();
            document.getElementById('modalDias').style.display = 'none';
        }
    };

    window.excluirEmpresa = async () => {
        const res = await api(`/api/empresas/${empresaAlvoID}`, { method: "DELETE" });
        if (res.ok) {
            showToast("Empresa removida! 🗑️");
            carregarEmpresas();
            document.getElementById('modalExcluir').style.display = 'none';
        }
    };

    window.logarComo = (id, nome) => {
        const godUser = { ...user, company_id: id, name: "👑 Master: " + nome, role: "admin" };
        localStorage.setItem("user", JSON.stringify(godUser));
        window.open("company-admin.html", "_blank");
    };

    window.criarEmpresa = async () => {
        const body = { 
            name: document.getElementById("nome").value, 
            email: document.getElementById("email").value, 
            whatsapp: document.getElementById("whatsapp").value, 
            senha: document.getElementById("senha").value 
        };
        const res = await api("/api/register-company", { method: "POST", body: JSON.stringify(body) });
        if(res.ok) { showToast("Cliente Ativado! 🚀"); carregarEmpresas(); }
    };

    window.alterarPlano = async (id, plano) => {
        await api(`/api/empresas/${id}/plano`, { method: "POST", body: JSON.stringify({ plano }) });
        showToast("Plano atualizado!");
        carregarEmpresas();
    };

    document.addEventListener("DOMContentLoaded", carregarEmpresas);
  </script>
</head>
<body>
  <header>
    <div style="font-size: 1.2rem;">👑 <strong>Painel Master</strong></div>
    <button class="btn cancel" onclick="localStorage.clear(); window.location.href='login.html'" style="padding: 8px 15px;">Sair</button>
  </header>

  <main>
    <div class="box" style="text-align: center;">
      <small style="color: var(--text-secondary)">Clientes no Império</small>
      <h2 id="total-count" style="margin: 5px 0; font-size: 2.2rem; color: var(--color-blue);">0</h2>
    </div>

    <section class="box">
      <h3 style="color: var(--color-green); margin-top: 0;">Ativar Novo Cliente 🚀</h3>
      <div class="form-row">
        <input id="nome" placeholder="Nome do Restaurante">
        <input id="whatsapp" placeholder="WhatsApp" type="tel">
        <input id="email" placeholder="E-mail de Login">
        <input id="senha" placeholder="Senha" type="password">
      </div>
      <button class="btn success" onclick="criarEmpresa()">Ativar Agora</button>
    </section>

    <div id="empresas-list"></div>
  </main>

  <div id="modalDias" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:10000; justify-content:center; align-items:center; backdrop-filter:blur(5px);">
      <div class="box" style="width: 300px; text-align: center; animation: popIn 0.3s ease;">
          <h3>Adicionar Dias 📅</h3>
          <input type="number" id="inputDias" placeholder="Ex: 30" style="width: 100%; margin-bottom: 15px; text-align: center; font-size: 1.2rem;">
          <div style="display: flex; gap: 10px;">
              <button onclick="adicionarDias()" class="btn success" style="flex:1;">Salvar</button>
              <button onclick="document.getElementById('modalDias').style.display='none'" class="btn cancel" style="flex:1;">Voltar</button>
          </div>
      </div>
  </div>

  <div id="modalExcluir" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:10000; justify-content:center; align-items:center; backdrop-filter:blur(5px);">
      <div class="box" style="width: 300px; text-align: center; border: 2px solid var(--color-red); animation: popIn 0.3s ease;">
          <h3 style="color: var(--color-red);">CUIDADO! ⚠️</h3>
          <p>Deseja realmente excluir este cliente permanentemente?</p>
          <div style="display: flex; gap: 10px;">
              <button onclick="excluirEmpresa()" class="btn success" style="background: var(--color-red); flex:1;">EXCLUIR</button>
              <button onclick="document.getElementById('modalExcluir').style.display='none'" class="btn cancel" style="background:#444; flex:1;">CANCELAR</button>
          </div>
      </div>
  </div>

</body>
</html>
