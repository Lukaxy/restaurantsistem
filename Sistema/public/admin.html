<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Painel Master - Digital Menu 👑</title>
  
  <style>
    /* CSS INTEGRADO - Mantido idêntico ao seu */
    :root {
      --bg-main: #0d0d0d;
      --bg-box: #1a1a1a;
      --color-blue: #339af0;
      --color-green: #51cf66;
      --color-red: #ff6b6b;
      --color-amber: #fcc419;
      --text-primary: #ffffff;
      --text-secondary: #adb5bd;
      --border-color: #2c2f33;
    }

    body {
      font-family: "Poppins", sans-serif;
      background: var(--bg-main);
      color: var(--text-primary);
      margin: 0; padding: 0;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1e1e1e;
      padding: 15px 20px;
      border-bottom: 2px solid var(--color-blue);
    }

    main { padding: 20px; max-width: 1100px; margin: 0 auto; }

    .box {
      background: var(--bg-box);
      padding: 20px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      margin-bottom: 20px;
    }

    .form-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px; }
    
    input, select {
      flex: 1; min-width: 200px;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background: #2b2b2b;
      color: white;
    }

    .btn {
      border: none; padding: 10px 20px;
      border-radius: 6px; cursor: pointer;
      font-weight: bold; color: white; transition: 0.3s;
    }
    .btn.success { background: var(--color-green); width: 100%; }
    .btn.cancel { background: var(--color-red); }
    .btn.action { background: #444; font-size: 0.85rem; padding: 5px 10px; }
    
    .badge {
      font-size: 0.7rem; padding: 3px 8px;
      border-radius: 4px; margin-left: 10px;
      text-transform: uppercase;
    }
    
    /* Pequeno ajuste para os botões de ação ficarem alinhados */
    .actions-row { margin-top: 10px; display: flex; gap: 8px; }
  </style>

  <script type="module">
    import { api } from "./js/http.js";

    // --- PROTEÇÃO DE ACESSO ---
    const user = JSON.parse(localStorage.getItem("user") || "{}");
    if (!user || user.role !== "master") {
      alert("Acesso restrito!");
      window.location.href = "admin-login.html";
    }

    // --- CARREGAR EMPRESAS ---
    async function carregarEmpresas() {
      const list = document.getElementById("empresas-list");
      const count = document.getElementById("total-count");
      
      try {
        // Certifique-se que sua API retorna o campo 'whatsapp'
        const data = await api("/api/empresas");
        if (!data.ok) throw new Error(data.error);

        count.textContent = data.empresas.length;
        
        list.innerHTML = data.empresas.map(e => {
          const hoje = new Date();
          const expira = new Date(e.trial_expires_at || e.data_vencimento); // Ajuste conforme seu banco
          const isExpirado = expira < hoje;
          const isVip = e.plano === 'vitalicio';
          
          // Lógica do Semáforo
          let statusLabel, statusColor;

          if (isVip) {
              statusLabel = "💎 VIP"; statusColor = "var(--color-blue)";
          } else if (isExpirado) {
              statusLabel = "🛑 VENCIDO"; statusColor = "var(--color-red)";
          } else if (e.plano === 'trial') {
              statusLabel = "🟡 TESTE"; statusColor = "var(--color-amber)";
          } else {
              statusLabel = "🟢 ATIVO"; statusColor = "var(--color-green)";
          }

          return `
            <div class="box" style="border-left: 5px solid ${statusColor}">
              <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                
                <div style="flex: 2;">
                  <strong style="font-size: 1.1em">${e.name}</strong> 
                  <span class="badge" style="background:${statusColor}; color: #000;">${statusLabel}</span>
                  
                  <div style="margin-top: 5px; color: var(--text-secondary); font-size: 0.9em;">
                    📧 ${e.email_admin} <br>
                    📱 ${e.whatsapp || 'Sem Whats'} <br>
                    📅 Expira em: <strong>${expira.toLocaleDateString()}</strong>
                  </div>

                  <div class="actions-row">
                    <button class="btn action" onclick="window.logarComo(${e.id}, '${e.name}')">🔑 Entrar</button>
                    <button class="btn action" onclick="window.adicionarDias(${e.id})">📅 + Dias</button>
                    <a href="https://wa.me/55${e.whatsapp}?text=Oi, seu plano venceu!" target="_blank" class="btn action" style="text-decoration:none; background: #25D366;">💬 Zap</a>
                  </div>
                </div>

                <div style="text-align: right;">
                  <select onchange="alterarPlano(${e.id}, this.value)" style="width: auto; padding: 5px; margin-bottom: 5px;">
                    <option value="trial" ${e.plano === 'trial' ? 'selected' : ''}>Teste Grátis</option>
                    <option value="basic" ${e.plano === 'basic' ? 'selected' : ''}>Mensal (Pago)</option>
                    <option value="vitalicio" ${e.plano === 'vitalicio' ? 'selected' : ''}>Vitalício</option>
                  </select>
                  <br>
                  <button class="btn cancel" onclick="excluirEmpresa(${e.id})" style="padding: 5px 10px;">🗑️ Excluir</button>
                </div>
              </div>
            </div>
          `;
        }).join("");
      } catch (err) { alert("Erro ao carregar: " + err.message); }
    }

    // --- NOVA FUNÇÃO: CRIAR COM WHATSAPP ---
    window.criarEmpresa = async () => {
      const body = {
        name: document.getElementById("nome").value,
        email: document.getElementById("email").value,
        whatsapp: document.getElementById("whatsapp").value, // Novo campo
        senha: document.getElementById("senha").value
      };
      
      if(!body.whatsapp) return alert("WhatsApp é obrigatório!");

      const res = await api("/api/register-company", { method: "POST", body: JSON.stringify(body) });
      if(res.ok) { alert("Empresa criada!"); carregarEmpresas(); }
    };

    // --- NOVA FUNÇÃO: GOD MODE (ENTRAR COMO CLIENTE) ---
    window.logarComo = (id, nome) => {
        if(confirm(`Entrar no painel de ${nome}?`)) {
            // Simulando login: Salva o ID da empresa no localStorage como se fosse o login dela
            // Ajuste as chaves conforme o que seu 'dashboard.html' espera
            localStorage.setItem("user", JSON.stringify({ id: id, role: "admin", name: nome }));
            window.open("company-admin.html", "_blank"); // Abre em nova aba
        }
    };

    // --- NOVA FUNÇÃO: ADICIONAR DIAS MANUALMENTE ---
    window.adicionarDias = async (id) => {
        const dias = prompt("Quantos dias extras você quer dar para essa empresa?");
        if (dias && !isNaN(dias)) {
            // Requer criar essa rota no backend
            const res = await api(`/api/empresas/${id}/add-days`, { 
                method: "POST", 
                body: JSON.stringify({ dias: parseInt(dias) }) 
            });
            if (res.ok) { alert("Dias adicionados!"); carregarEmpresas(); }
        }
    };

    // --- ALTERAR PLANO ---
    window.alterarPlano = async (id, plano) => {
      const res = await api(`/api/empresas/${id}/plano`, { method: "POST", body: JSON.stringify({ plano }) });
      if(res.ok) carregarEmpresas();
    };

    // --- EXCLUIR ---
    window.excluirEmpresa = async (id) => {
      if(confirm("Tem certeza? Isso apaga cardápios e pedidos!")) {
        await api(`/api/empresas/${id}`, { method: "DELETE" });
        carregarEmpresas();
      }
    };

    window.logout = () => { localStorage.clear(); window.location.href="admin-login.html"; };
    
    // Tornar funções globais para o onclick funcionar com type=module
    window.carregarEmpresas = carregarEmpresas;
    document.addEventListener("DOMContentLoaded", carregarEmpresas);
  </script>
</head>
<body>
  <header>
    <div style="font-size: 1.5rem;">👑 <strong>Painel Master</strong></div>
    <button class="btn cancel" onclick="logout()">Sair</button>
  </header>

  <main>
    <div class="box" style="text-align: center;">
      <small style="color: var(--text-secondary)">Total de Clientes no Império</small>
      <h2 id="total-count" style="margin: 5px 0; font-size: 2.5rem; color: var(--color-blue);">...</h2>
    </div>

    <section class="box">
      <h3 style="color: var(--color-green)">Ativar Novo Cliente 🏢</h3>
      <div class="form-row">
        <input id="nome" placeholder="Nome do Restaurante">
        <input id="email" placeholder="E-mail de Login">
        <input id="whatsapp" placeholder="WhatsApp (ex: 11999999999)" type="tel"> 
        <input id="senha" placeholder="Senha" type="password">
      </div>
      <button class="btn success" onclick="criarEmpresa()">Ativar Agora 🚀</button>
    </section>

    <h2 style="margin-top: 30px;">Gestão de Empresas 📋</h2>
    <div id="empresas-list"></div>
  </main>
</body>
</html>
