<script type="module">
    import { api } from "./js/http.js";

    // ================== VERIFICA LOGIN MASTER ==================
    const user = JSON.parse(localStorage.getItem("user") || "{}");
    if (!user || user.role !== "master") {
      alert("Acesso negado.");
      localStorage.clear();
      window.location.href = "admin-login.html";
    }

    // ================== FUNÇÃO AUXILIAR DE STATUS ==================
    function getStatusInfo(e) {
      if (e.plano === 'vitalicio') return { label: '💎 VIP / VITALÍCIO', color: 'var(--color-blue)' };
      
      const hoje = new Date();
      const expira = new Date(e.trial_expires_at);
      
      if (hoje > expira && e.plano === 'trial') {
        return { label: '🛑 EXPIRADO', color: 'var(--color-red)' };
      }
      
      return { label: `⏳ Expira: ${expira.toLocaleDateString("pt-BR")}`, color: 'var(--color-green)' };
    }

    // ================== LISTAR EMPRESAS ==================
    async function carregarEmpresas() {
      const div = document.getElementById("empresas-list");
      const countEl = document.getElementById("total-count");
      div.innerHTML = "<p style='text-align:center;'>Buscando império...</p>";

      try {
        const data = await api("/api/empresas");
        if (!data.ok) throw new Error(data.error || "Erro ao buscar empresas.");
        
        countEl.textContent = data.empresas.length;

        if (!data.empresas.length) {
          div.innerHTML = "<p style='text-align:center; color:var(--text-secondary);'>Nenhum cliente ainda. Hora de vender! 🚀</p>";
          return;
        }

        div.innerHTML = data.empresas.map(e => {
          const status = getStatusInfo(e);
          return `
          <div class="box" style="margin-bottom: 15px; border-left: 5px solid ${status.color};">
            <div style="display: flex; justify-content: space-between; align-items: flex-start;">
              <div>
                <strong style="font-size: 1.2rem; color: var(--text-primary);">${e.name}</strong> 
                <span style="font-size: 0.7rem; background: ${status.color}; color: white; padding: 2px 6px; border-radius: 4px; margin-left: 10px;">
                    ${status.label}
                </span>
                <br>
                <small style="color: var(--text-secondary);">${e.email_admin}</small><br>
                <small style="color: #666;">Criada em: ${new Date(e.created_at).toLocaleDateString("pt-BR")}</small>
              </div>
              <div style="text-align: right;">
                <label style="font-size: 0.75rem; color: var(--text-secondary); display: block; margin-bottom: 4px;">ALTERAR ACESSO</label>
                <select class="btn" style="background: var(--bg-main); padding: 5px; font-size: 0.8rem; border: 1px solid var(--border-color);" onchange="alterarPlano(${e.id}, this.value)">
                  <option value="trial" ${e.plano === "trial" ? "selected" : ""}>Teste (5 dias)</option>
                  <option value="basic" ${e.plano === "basic" ? "selected" : ""}>Mensal (Ativo)</option>
                  <option value="vitalicio" ${e.plano === "vitalicio" ? "selected" : ""}>💎 Vitalício (Grátis)</option>
                </select>
              </div>
            </div>
            
            <div style="margin-top: 15px; display: flex; justify-content: space-between; align-items: center;">
                <small style="color: var(--text-secondary)">ID: #${e.id}</small>
                <button class="btn cancel" onclick="excluirEmpresa(${e.id})" style="padding: 5px 12px; font-size: 0.85rem;">
                    🗑️ Remover Cliente
                </button>
            </div>
          </div>
        `}).join("");
      } catch (err) {
        div.innerHTML = `<p style="color:var(--color-red); text-align:center;">${err.message}</p>`;
      }
    }

    // ================== ALTERAR PLANO ==================
    window.alterarPlano = async function(id, plano) {
      try {
        const data = await api(`/api/empresas/${id}/plano`, {
          method: "POST",
          body: JSON.stringify({ plano }),
        });
        if (!data.ok) throw new Error(data.error || "Erro ao atualizar.");
        alert("Acesso do cliente atualizado!");
        carregarEmpresas();
      } catch (err) {
        alert("Erro: " + err.message);
      }
    };

    // ... (restante das funções criarEmpresa, excluirEmpresa e logout que você já tem)
    window.criarEmpresa = criarEmpresa;
    window.excluirEmpresa = excluirEmpresa;
    window.logout = logout;

    document.addEventListener("DOMContentLoaded", carregarEmpresas);
  </script>
