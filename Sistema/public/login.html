<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="img/icone.png">
  <title>Login - Digital Menu 🔐</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
        --bg-main: #F7F9FC;
        --bg-card: #FFFFFF;
        --bg-input: #EDF2F7;
        --color-blue: #2B6CB0;
        --color-green: #38A169;
        --color-red: #E53E3E;
        --color-amber: #D69E2E;
        --text-primary: #1A202C;
        --text-secondary: #718096;
        --border-color: #E2E8F0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        font-family: 'Poppins', sans-serif;
        background-color: var(--bg-main);
        color: var(--text-primary);
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 20px;
    }

    .login-box {
        background: var(--bg-card);
        padding: 40px 30px;
        border-radius: 16px;
        width: 100%;
        max-width: 400px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        border: 1px solid var(--border-color);
        animation: popIn 0.4s ease;
    }

    .login-header { text-align: center; margin-bottom: 30px; }
    .login-header h2 { color: var(--color-blue); margin-bottom: 5px; font-size: 1.8rem; }
    .login-header p { font-size: 0.95rem; color: var(--text-secondary); }

    .input-group { display: flex; flex-direction: column; text-align: left; margin-bottom: 20px; }
    .input-group label { font-size: 0.9rem; font-weight: 600; color: var(--text-primary); margin-bottom: 8px; display: block;}
    
    input {
        background: var(--bg-input); border: 1px solid var(--border-color);
        color: var(--text-primary); padding: 14px 15px; border-radius: 8px;
        font-family: inherit; font-size: 1rem; outline: none; width: 100%; transition: 0.2s;
    }
    input:focus { border-color: var(--color-blue); background: #FFF; box-shadow: 0 0 0 3px rgba(43, 108, 176, 0.1); }

    .btn {
        width: 100%; padding: 15px; border-radius: 8px; font-weight: bold; border: none; cursor: pointer; 
        font-family: inherit; font-size: 1.05rem; color: white; transition: 0.2s; background: var(--color-blue);
        margin-top: 10px;
    }
    .btn:hover { opacity: 0.9; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(43, 108, 176, 0.2); }
    .btn:disabled { background: var(--text-secondary); cursor: not-allowed; transform: none; box-shadow: none; }

    #msg { text-align: center; margin-top: 20px; font-weight: bold; min-height: 20px; font-size: 0.95rem; }

    .divider { border: 0; border-top: 1px solid var(--border-color); margin: 30px 0; }

    .footer-links { text-align: center; font-size: 0.9rem; color: var(--text-secondary); line-height: 1.6;}
    .footer-links a { color: var(--color-blue); font-weight: bold; text-decoration: none; transition: 0.2s; }
    .footer-links a:hover { color: #1A365D; text-decoration: underline; }

    @keyframes popIn { 0% { transform: scale(0.95); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  </style>

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-2BTBZ5MK63"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-2BTBZ5MK63');
  </script>
</head>
<body>

  <div class="login-box">
    <div class="login-header">
        <h2>Olá novamente!👋</h2>
        <p>Acesse o painel da sua empresa.</p>
    </div>

    <div class="input-group">
        <label for="email">Seu E-mail</label>
        <input type="email" id="email" placeholder="nome@exemplo.com" autocomplete="username" />
    </div>

    <div class="input-group">
        <label for="senha">Sua Senha</label>
        <input type="password" id="senha" placeholder="••••••••" autocomplete="current-password" />
    </div>

    <button class="btn" id="btn-login" onclick="login()">Entrar no Sistema</button>

    <p id="msg"></p>

    <hr class="divider">

    <div class="footer-links">
        <div style="margin-bottom: 10px;">
            Novo por aqui? <br>
            <a href="https://sistemadigitalmenu.com.br/landing.html#cadastro" target="_blank">Registre-se agora!</a>
        </div>
        <div>
            Dificuldade para acessar? <br>
            <a href="https://wa.me/+5567992545735" target="_blank" style="color: var(--color-amber);">Fale com o Suporte</a>
        </div>
    </div>
  </div>

  <script>
    async function login() {
      const email = document.getElementById('email').value.trim();
      const senha = document.getElementById('senha').value.trim();
      const msg = document.getElementById('msg');
      const btn = document.getElementById('btn-login');

      msg.textContent = '';

      if (!email || !senha) {
        msg.style.color = 'var(--color-amber)';
        msg.textContent = '⚠️ Preencha e-mail e senha.';
        
        // Efeito de tremer no botão se der erro
        btn.style.transform = "translateX(-5px)";
        setTimeout(() => btn.style.transform = "translateX(5px)", 100);
        setTimeout(() => btn.style.transform = "translateX(0)", 200);
        return;
      }

      // Feedback visual no botão
      btn.disabled = true;
      const originalText = btn.innerText;
      btn.innerText = 'Validando... ⏳';

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, senha })
        });

        const data = await res.json();

        if (!res.ok || !data.ok) {
          throw new Error(data.error || 'E-mail ou senha inválidos.');
        }

        // SALVA OS DADOS DO USUÁRIO
        localStorage.setItem('user', JSON.stringify(data.user));

        msg.style.color = 'var(--color-green)';
        msg.textContent = 'Login realizado! Redirecionando... ✅';
        btn.innerText = 'Sucesso!';
        btn.style.background = 'var(--color-green)';

        setTimeout(() => {
          const role = (data.user.role || '').toLowerCase();

          // Redirecionamento Inteligente baseado no cargo
          if (role === 'admin') {
            window.location.href = 'caixa.html';
          } else if (role === 'atendente') {
            window.location.href = 'meus-pedidos.html';
          } else if (role === 'cozinha') {
            window.location.href = 'cozinha.html';
          } else if (role === 'bar') {
            window.location.href = 'bar.html';
          } else {
            window.location.href = 'caixa.html';
          }
        }, 1000);

      } catch (err) {
        console.error(err);
        msg.style.color = 'var(--color-red)';
        msg.textContent = '❌ ' + err.message;
        btn.disabled = false;
        btn.innerText = originalText;
        
        // Efeito de tremer
        btn.style.transform = "translateX(-5px)";
        setTimeout(() => btn.style.transform = "translateX(5px)", 100);
        setTimeout(() => btn.style.transform = "translateX(0)", 200);
      }
    }

    // Atalho do teclado
    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') login();
    });
  </script>
</body>
</html>
