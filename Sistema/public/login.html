<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Digital Menu 🔐 </title>
  
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="auth-page">

  <div class="box" style="max-width: 380px; width: 95%; padding: 30px;">
    <div style="text-align: center; margin-bottom: 25px;">
        <h2 style="color: var(--color-blue); margin-bottom: 5px;">Olá novamente!👋</h2>
        <p style="font-size: 0.9rem; color: var(--text-secondary);">Acesse o painel da sua empresa.</p>
    </div>

    <div style="display: flex; flex-direction: column; gap: 5px;">
        <label>Seu E-mail</label>
        <input type="email" id="email" placeholder="nome@exemplo.com" autocomplete="username" />

        <label style="margin-top: 10px;">Sua Senha</label>
        <input type="password" id="senha" placeholder="••••••••" autocomplete="current-password" />
    </div>

    <button class="btn" onclick="login()" style="width: 100%; margin-top: 25px; padding: 15px;">
        Entrar no Sistema
    </button>

    <p id="msg" style="text-align: center; margin-top: 20px; font-weight: bold; min-height: 20px;"></p>

    <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 25px 0;">

    <div style="text-align: center; font-size: 0.85rem; color: var(--text-secondary);">
        Novo por aqui? Se resgistre agora! <br>
        <a href="https://restaurantsistem.onrender.com/landing.html#cadastro" target="_blank" style="color: var(--color-amber); font-weight: bold;">
            Registrar-se
        </a>
    <div style="text-align: center; font-size: 0.85rem; color: var(--text-secondary); margin-top: 10px;">
        Dificuldade para acessar? <br>
        <a href="https://instagram.com/" target="_blank" style="color: var(--color-amber); font-weight: bold;">
            Fale com o Administrador
        </a>
    </div>
  </div>

  <script>
    async function login() {
      const email = document.getElementById('email').value.trim();
      const senha = document.getElementById('senha').value.trim();
      const msg = document.getElementById('msg');
      const btn = document.querySelector('button');

      msg.textContent = '';

      if (!email || !senha) {
        msg.style.color = 'var(--color-amber)';
        msg.textContent = '⚠️ Preencha e-mail e senha. ⚠️';
        return;
      }

      // Feedback visual no botão
      btn.disabled = true;
      const originalText = btn.innerText;
      btn.innerText = 'Validando...';

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, senha })
        });

        const data = await res.json();

        if (!res.ok || !data.ok) {
          throw new Error(data.error || 'E-mail ou senha inválidos.');
        }

        // ✅ SALVA OS DADOS DO USUÁRIO
        localStorage.setItem('user', JSON.stringify(data.user));

        msg.style.color = 'var(--color-green)';
        msg.textContent = 'Login realizado! Redirecionando... ✅';

        setTimeout(() => {
          const role = (data.user.role || '').toLowerCase();

          // Redirecionamento Inteligente baseado no cargo
          if (role === 'admin') {
            window.location.href = 'index.html';
          } else if (role === 'atendente') {
            window.location.href = 'meus-pedidos.html';
          } else if (role === 'cozinha') {
            window.location.href = 'cozinha.html';
          } else {
            window.location.href = 'index.html';
          }
        }, 800);

      } catch (err) {
        console.error(err);
        msg.style.color = 'var(--color-red)';
        msg.textContent = '❌ ' + err.message;
        btn.disabled = false;
        btn.innerText = originalText;
      }
    }

    // Atalho do teclado
    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') login();
    });
  </script>
</body>
</html>
