<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🔐 Login - Sistema Restaurante</title>
  <link rel="stylesheet" href="css/login.css" />
</head>
<body>
  <div class="login-container">
    <h2>🔐 Login</h2>

    <input type="email" id="email" placeholder="E-mail" autocomplete="username" />
    <input type="password" id="senha" placeholder="Senha" autocomplete="current-password" />

    <button type="button" onclick="login()">Entrar</button>

    <p style="margin-top:10px;">
      Não tem conta?
      <a href="register-company.html">Registrar empresa</a>
    </p>

    <p id="msg" style="color:red;margin-top:10px;"></p>
  </div>

  <script>
    async function login() {
      const email = document.getElementById('email').value.trim();
      const senha = document.getElementById('senha').value.trim();
      const msg = document.getElementById('msg');

      msg.textContent = '';
      msg.style.color = 'red';

      if (!email || !senha) {
        msg.textContent = 'Preencha e-mail e senha.';
        return;
      }

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, senha })
        });

        const data = await res.json();

        if (!res.ok || !data.ok) {
          throw new Error(data.error || 'Erro no login');
        }

        // ✅ SALVA EXATAMENTE O QUE O BACKEND ENVIOU
        localStorage.setItem('user', JSON.stringify(data.user));

        msg.style.color = 'green';
        msg.textContent = '✅ Login realizado! Redirecionando...';

        setTimeout(() => {
          const role = (data.user.role || '').toLowerCase();

          if (role === 'admin') {
            window.location.href = 'index.html';
          } else if (role === 'atendente') {
            window.location.href = 'meus-pedidos.html';
          } else if (role === 'cozinha') {
            window.location.href = 'cozinha.html';
          } else {
            window.location.href = 'index.html';
          }
        }, 600);

      } catch (err) {
        console.error(err);
        msg.textContent = err.message;
      }
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') login();
    });
  </script>
</body>
</html>
