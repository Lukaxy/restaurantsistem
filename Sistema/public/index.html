<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>🍽️ Restaurante</title>
  <link rel="stylesheet" href="css/index.css" />
  <link rel="stylesheet" href="css/style.css" />
  
  <script src="js/auth.js"></script>
</head>

<body>

<script>
  const user = JSON.parse(localStorage.getItem("user") || "null");
  if (!user || !user.id) {
    window.location.href = "login.html";
  }
</script>

<header>
  <div class="menu-wrapper">
    <button class="menu-button" onclick="toggleMenu()">⋮</button>
    <div id="menuDropdown" class="menu-dropdown">
      <div onclick="location.href='meus-pedidos.html'">🧾 Meus pedidos</div>
      <div onclick="location.href='relatorio.html'">📈 Relatório</div>
      <div onclick="location.href='cozinha.html'">👨‍🍳 Cozinha</div>
      <div onclick="location.href='configuracoes.html'">⚙️ Configurações</div>
      <div onclick="abrirPainelEmpresa()">🏢 Painel da Empresa</div>
    </div>
  </div>
  <div class="header-title">Cardápio 🍽️</div>
</header>

<main>
  <div id="categories" class="categories">Carregando cardápio...</div>
</main>

<button class="cart" id="openCart">
  🧺 Comanda <span id="cartCount" class="qty">0</span>
</button>

<div class="modal" id="cartModal">
  <div class="box">
    <h3>Pedido</h3>
    <div id="cartList"></div>
    <div class="pedido-form">
      <input id="tableName" placeholder="Mesa / Nome do cliente" autocomplete="off" />
      <textarea id="notes" placeholder="Observações (ex: sem cebola...)"></textarea>
    </div>
    <div class="pedido-actions">
      <button class="btn" id="sendOrder">Enviar pedido</button>
      <button class="btn cancel" id="closeCart">Fechar</button>
    </div>
  </div>
</div>

<div id="notification" class="notification"></div>

<div class="modal" id="productModal" style="display:none;">
  <div class="box">
    <h3 id="productName">Produto</h3>
    <p id="productDescription" class="desc"></p>
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <span id="productPrice"></span>
      <button id="addToCartBtn" class="btn">Adicionar à comanda</button>
    </div>
    <button class="btn cancel" id="closeProductModal" style="margin-top:12px;">Fechar</button>
  </div>
</div>

<script type="module" src="js/cardapio.js"></script>

<script>
  function toggleMenu() {
    document.getElementById("menuDropdown").classList.toggle("show");
  }
  
  function abrirPainelEmpresa() {
    // Reutiliza a função do auth.js ou lê direto
    const u = JSON.parse(localStorage.getItem("user") || "{}");
    if (u.role === "admin" || u.role === "master") {
      window.location.href = "company-admin.html";
    } else {
      alert("Acesso negado.");
    }
  }

  // Fecha menu ao clicar fora
  document.addEventListener("click", e => {
    if (!e.target.closest(".menu-wrapper")) {
      document.getElementById("menuDropdown").classList.remove("show");
    }
  });
</script>

<style>
/* CSS Crítico */
.modal { display: none; }
.modal[style*="flex"] { display: flex !important; justify-content: center; align-items: center; }
.desc { color: #aaa; font-size: 0.9rem; margin: 10px 0; }
</style>

</body>
</html>
