<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Painel da Cozinha 👨‍🍳</title>
  <link rel="stylesheet" href="css/style.css" />
  
  <script src="js/auth.js"></script>
</head>
  <style>
        .menu-dropdown {
      display: none;
      position: absolute;
      background: #1e1e1e;
      border: 1px solid var(--border-color);
      right: 30px;
      top: 60px;
      z-index: 100;
    }
    .menu-dropdown.show { display: block; }
    .menu-dropdown div { padding: 10px 20px; cursor: pointer; border-bottom: 1px solid #333; }
  </style>
  
<body>

<header>
  <div class="menu-wrapper">
    <button class="menu-button" onclick="toggleMenu()">⋮</button>
    <div id="menuDropdown" class="menu-dropdown">
      <div onclick="window.location.href='meus-pedidos.html'">🧾 Meus pedidos</div>
      <div onclick="window.location.href='relatorio.html'">📈 Relatório</div>
      <div onclick="window.location.href='cozinha.html'">👨‍🍳 Cozinha</div>
      <div onclick="window.location.href='configuracoes.html'">⚙️ Configurações</div>
      <div onclick="window.location.href='index.html'">📙 Cardápio</div>
      <div onclick="abrirPainelEmpresa()">🏢 Painel da Empresa</div>
      <div onclick="logout()" style="color: var(--color-red);">🚪 Sair do Sistema</div>
    </div>
  </div>
  <div class="header-title">Painel da Cozinha 👨‍🍳</div>
</header>

<main>
  <div id="orders">
     <p style="text-align:center; margin-top: 20px;">Carregando sistema...</p>
  </div>
</main>

<script src="js/cozinha.js"></script>

<script>
function abrirPainelEmpresa() {
  const u = JSON.parse(localStorage.getItem("user") || "{}");
  if (u.role === "admin" || u.role === "master") {
    window.location.href = "company-admin.html";
  } else {
    alert("Apenas o administrador da empresa pode acessar este painel.");
  }
}

function toggleMenu() {
  document.getElementById("menuDropdown").classList.toggle("show");
}

document.addEventListener("click", e => {
  if (!e.target.closest(".menu-wrapper")) {
    document.getElementById("menuDropdown").classList.remove("show");
  }
});
</script>

</body>
</html>
