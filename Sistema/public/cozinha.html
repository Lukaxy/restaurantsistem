<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Painel da Cozinha 👨‍🍳</title>
  <link rel="stylesheet" href="css/style.css" />
  
  <script src="js/auth.js"></script>
  <style>
    .menu-dropdown {
      display: none;
      position: absolute;
      background: #1a1d21;
      border: 1px solid var(--border-color);
      right: 30px;
      top: 60px;
      z-index: 100;
    }
    .menu-dropdown.show { display: block; }
    .menu-dropdown div { padding: 10px 20px; cursor: pointer; border-bottom: 1px solid #333; }
    
    /* Estilos extras para os cards ficarem organizados */
    .order-card { background: var(--bg-card); padding: 15px; margin-bottom: 15px; border-radius: 12px; border: 1px solid var(--border-color); }
    .order-header { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 10px; color: var(--color-blue); }
    .order-item { padding: 5px 0; border-bottom: 1px solid #3a3f44; color: var(--text-primary); }
    .order-obs { color: #fcc419; font-size: 0.9em; margin-top: 2px; }
    .btn-action { width: 100%; padding: 10px; margin-top: 10px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
    .btn-accept { background: var(--color-blue); color: white; }
    .btn-ready { background: var(--color-green); color: white; }
  </style>
</head>

<body>

<header>
  <div class="menu-wrapper">
    <button class="menu-button" onclick="toggleMenu()">⋮</button>
    <div id="menuDropdown" class="menu-dropdown">
      <div onclick="window.location.href='meus-pedidos.html'">Meus pedidos 🧾</div>
      <div onclick="window.location.href='relatorio.html'">Relatório 📈</div>
      <div onclick="window.location.href='cozinha.html'">Cozinha 👨‍🍳</div>
      <div onclick="window.location.href='bar.html'">Bar🍹</div>
      <div onclick="window.location.href='configuracoes.html'">Configurações ⚙️</div>
      <div onclick="window.location.href='index.html'">Cardápio 📙</div>
      <div onclick="location.href='company-admin.html'">Painel da Empresa  🏢</div>
      <div onclick="location.href='tutorial.html'">Tutoriais 📚</div>
      <div onclick="logout()" style="color: var(--color-red);">Sair do Sistema 🚪</div>
    </div>
  </div>
  <div class="header-title">Painel da Cozinha 👨‍🍳</div>
</header>

<main>
  <div id="orders">
     <p style="text-align:center; margin-top: 20px; color: #adb5bd;">Aguardando pedidos...</p>
  </div>
</main>

<script>
// ============================================================
// LÓGICA DA COZINHA (SOMENTE NOVO E PREPARANDO)
// ============================================================
const ordersDiv = document.getElementById("orders");
const user = JSON.parse(localStorage.getItem("user"));

// Inicia o loop de atualização (5 segundos)
setInterval(loadOrders, 5000);
loadOrders(); // Chama a primeira vez imediatamente

async function loadOrders() {
    // Segurança: se não tiver usuário logado, não faz nada
    if (!user || !user.company_id) return;

    try {
        const res = await fetch(`/api/orders?company_id=${user.company_id}`);
        const data = await res.json();
        
        if (!data.ok) return;

        // --- FILTRO PRINCIPAL ---
        // Só mostra na tela se o status for 'novo' ou 'preparando'.
        // Pedidos com status 'pronto', 'entregue', 'finalizado' ou 'cancelado' NÃO aparecem.
        const activeOrders = data.pedidos.filter(p => 
            p.status === 'novo' || p.status === 'preparando'
        );

        if(activeOrders.length === 0) {
            ordersDiv.innerHTML = '<p style="text-align:center; margin-top: 50px; color: #adb5bd;">Tudo limpo! Sem pedidos pendentes.</p>';
            return;
        }

        ordersDiv.innerHTML = ""; // Limpa a tela antes de desenhar

        activeOrders.forEach(order => {
            // --- FILTRO DE ITEM (COZINHA) ---
            // Mostra itens que NÃO são do bar.
            const itemsToShow = order.items.filter(item => item.destination !== 'bar');

            // Se o pedido só tem bebida, não mostra o card na cozinha
            if (itemsToShow.length === 0) return; 

            const card = document.createElement("div");
            card.className = "order-card";
            
            // Cor da borda: Laranja (Novo) ou Verde (Preparando)
            const statusColor = order.status === 'novo' ? '#e8590c' : '#51cf66';
            card.style.borderLeft = `5px solid ${statusColor}`;

            let itemsHtml = itemsToShow.map(item => `
                <div class="order-item">
                    <span style="font-weight:bold;">1x</span> ${item.name}
                    ${item.notes ? `<div class="order-obs">⚠️ ${item.notes}</div>` : ''}
                </div>
            `).join("");

            // Definição do Botão
            let btnHtml = "";
            if (order.status === 'novo') {
                btnHtml = `<button class="btn-action btn-accept" onclick="updateStatus(${order.id}, 'preparando')">🔥 Aceitar e Preparar</button>`;
            } else if (order.status === 'preparando') {
                // Ao clicar aqui, muda status para 'pronto' e o pedido SOME da tela no próximo loadOrders()
                btnHtml = `<button class="btn-action btn-ready" onclick="updateStatus(${order.id}, 'pronto')">✅ Pronto (Liberar)</button>`;
            }

            card.innerHTML = `
                <div class="order-header">
                    <span style="font-size:1.1rem;">${order.table_name || 'Balcão'}</span>
                    <span>#${order.id}</span>
                </div>
                <div style="margin-bottom:10px; font-size:0.8rem; color:#888;">⏰ ${new Date(order.created_at).toLocaleTimeString().substring(0,5)}</div>
                ${itemsHtml}
                ${order.notes ? `<div style="background:#333; padding:5px; margin-top:5px; border-radius:4px; color:#fcc419;">📝 Nota Geral: ${order.notes}</div>` : ''}
                ${btnHtml}
            `;
            
            ordersDiv.appendChild(card);
        });

    } catch (err) {
        console.error("Erro de conexão:", err);
    }
}

async function updateStatus(id, status) {
    if(!confirm("Confirmar mudança de status?")) return;
    
    try {
        await fetch(`/api/orders/${id}/status`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ status })
        });
        
        // Recarrega a lista imediatamente para o usuário ver o efeito (o pedido sumir)
        loadOrders(); 
    } catch (e) { 
        alert("Erro ao atualizar status. Verifique sua conexão."); 
    }
}

// Menu Toggle
function toggleMenu() {
    const menu = document.getElementById("menuDropdown");
    if(menu) menu.classList.toggle("show");
}
document.addEventListener("click", e => {
    const menu = document.getElementById("menuDropdown");
    if (menu && !e.target.closest(".menu-wrapper")) {
        menu.classList.remove("show");
    }
});
</script>
</body>
</html>
