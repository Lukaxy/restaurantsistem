<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Painel da Cozinha 👨‍🍳</title>
  <link rel="stylesheet" href="css/style.css" />
  
  <script src="js/auth.js"></script>
  <style>
    .menu-dropdown {
      display: none;
      position: absolute;
      background: #1a1d21;
      border: 1px solid var(--border-color);
      right: 30px;
      top: 60px;
      z-index: 100;
    }
    .menu-dropdown.show { display: block; }
    .menu-dropdown div { padding: 10px 20px; cursor: pointer; border-bottom: 1px solid #333; }
    
    /* Estilos extras para os cards ficarem organizados */
    .order-card { background: var(--bg-card); padding: 15px; margin-bottom: 15px; border-radius: 12px; border: 1px solid var(--border-color); }
    .order-header { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 10px; color: var(--color-blue); }
    .order-item { padding: 5px 0; border-bottom: 1px solid #3a3f44; color: var(--text-primary); }
    .order-obs { color: #fcc419; font-size: 0.9em; margin-top: 2px; }
    .btn-action { width: 100%; padding: 10px; margin-top: 10px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
    .btn-accept { background: var(--color-blue); color: white; }
    .btn-ready { background: var(--color-green); color: white; }
  </style>
</head>

<body>

<header>
  <div class="menu-wrapper">
    <button class="menu-button" onclick="toggleMenu()">⋮</button>
    <div id="menuDropdown" class="menu-dropdown">
      <div onclick="window.location.href='index.html'">Cardápio 📙</div>
      <div onclick="window.location.href='bar.html'">Bar🍹</div>
      <div onclick="window.location.href='meus-pedidos.html'">Meus pedidos 🧾</div>
      <div onclick="window.location.href='relatorio.html'">Relatório 📈</div>
      <div onclick="window.location.href='configuracoes.html'">Configurações ⚙️</div>
      <div onclick="location.href='company-admin.html'">Painel da Empresa  🏢</div>
      <div onclick="location.href='tutorial.html'">Tutoriais 📚</div>
      <div onclick="logout()" style="color: var(--color-red);">Sair do Sistema 🚪</div>
    </div>
  </div>
  <div class="header-title">Painel da Cozinha 👨‍🍳</div>
</header>

<main>
  <div id="orders">
     <p style="text-align:center; margin-top: 20px; color: #adb5bd;">Aguardando pedidos...</p>
  </div>
</main>

  <script>
const ordersDiv = document.getElementById("orders");
const user = JSON.parse(localStorage.getItem("user"));

// Verifica login
if (!user || !user.company_id) window.location.href = "login.html";

setInterval(loadOrders, 5000);
loadOrders();

async function loadOrders() {
    try {
        const res = await fetch(`/api/orders?company_id=${user.company_id}`);
        const data = await res.json();
        
        if (!data.ok) return;

        // FILTRO DA COZINHA (Mantemos a lógica original de setor)
        const activeOrders = data.pedidos.filter(p => {
            const statusK = p.status_cozinha || 'novo'; 
            // Mostra se for novo ou preparando. Se já for 'pronto', sai da tela.
            return statusK === 'novo' || statusK === 'preparando';
        });

        if(activeOrders.length === 0) {
            ordersDiv.innerHTML = '<p style="text-align:center; margin-top: 50px; color: #adb5bd;">Cozinha livre! 👨‍🍳</p>';
            return;
        }

        ordersDiv.innerHTML = "";

        activeOrders.forEach(order => {
            // 1. Filtra itens que NÃO são Bar
            const itemsToShow = order.items.filter(item => item.destination !== 'bar');
            
            // Se o pedido só tem bebida, não mostra na cozinha
            if (itemsToShow.length === 0) return; 

            // 2. Descobre o Status da Cozinha
            const currentStatus = order.status_cozinha || 'novo';

            // 3. VERIFICAÇÃO INTELIGENTE DO BAR
            // Verifica se existe item de bar E se ele ainda não está pronto
            const temBar = order.items.some(item => item.destination === 'bar');
            const barPendente = temBar && (order.status_bar !== 'pronto' && order.status_bar !== 'entregue');

            const card = document.createElement("div");
            card.className = "order-card";
            const statusColor = currentStatus === 'novo' ? '#e8590c' : '#51cf66';
            card.style.borderLeft = `5px solid ${statusColor}`;

            let itemsHtml = itemsToShow.map(item => `
                <div class="order-item">
                    <span style="font-weight:bold;">${item.qty || '1'}x</span> ${item.name}
                    ${item.notes ? `<div class="order-obs">⚠️ ${item.notes}</div>` : ''}
                </div>
            `).join("");

            let btnHtml = "";
            
            // Lógica dos Botões
            if (currentStatus === 'novo') {
                // Ao ACEITAR: Atualiza Cozinha para 'preparando' E Global para 'preparando' (pro cliente ver que começou)
                btnHtml = `<button class="btn-action btn-accept" onclick="processarEtapa(${order.id}, 'aceitar')">Aceitar 🔥</button>`;
            
            } else if (currentStatus === 'preparando') {
                // Ao FINALIZAR: Passamos o flag se o bar está pendente ou não
                btnHtml = `<button class="btn-action btn-ready" onclick="processarEtapa(${order.id}, 'finalizar', ${barPendente})">Pronto ✅</button>`;
            }

            card.innerHTML = `
                <div class="order-header">
                    <span>${order.table_name || 'Balcão'}</span>
                    <span>#${order.id}</span>
                </div>
                <div style="margin-bottom:10px; font-size:0.8rem; color:#888;">
                    ⏰ ${new Date(order.created_at).toLocaleTimeString().substring(0,5)}
                    ${barPendente ? '<span style="float:right; color:#fcc419;">Aguarde o bar finalizar para clicar em pronto! 🍹</span>' : ''}
                </div>
                ${itemsHtml}
                ${order.notes ? `<div style="background:#333; padding:5px; margin-top:5px; border-radius:4px; color:#fcc419;">📝 ${order.notes}</div>` : ''}
                ${btnHtml}
            `;
            ordersDiv.appendChild(card);
        });

    } catch (err) { console.error(err); }
}

// FUNÇÃO UNIFICADA E INTELIGENTE
async function processarEtapa(id, acao, barPendente = false) {
    const btn = event.target;
    btn.innerHTML = "...";
    btn.disabled = true;

    try {
        if (acao === 'aceitar') {
            // 1. Avisa que a cozinha pegou (Setor)
            await updateSector(id, 'cozinha', 'preparando');
            // 2. Avisa o Global que começou (para sair de 'novo' nos Meus Pedidos)
            await updateGlobal(id, 'preparando');
        
        } else if (acao === 'finalizar') {
            // 1. Cozinha terminou
            await updateSector(id, 'cozinha', 'pronto');

            // 2. O PULO DO GATO:
            // Só marca o pedido Global como 'pronto' se o Bar NÃO estiver pendente.
            if (!barPendente) {
                console.log("Cozinha terminou e Bar está ok/inexistente. Finalizando pedido Global.");
                await updateGlobal(id, 'pronto');
            } else {
                console.log("Cozinha terminou, mas Bar ainda trabalha. Mantendo Global em preparando.");
            }
        }
        
        loadOrders();
    } catch (e) {
        console.error(e);
        alert("Erro ao processar");
        btn.disabled = false;
    }
}

// Funções auxiliares de API
async function updateSector(id, sector, status) {
    await fetch(`/api/orders/${id}/status-sector`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sector, status })
    });
}

async function updateGlobal(id, status) {
    await fetch(`/api/orders/${id}/status`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status })
    });
}

// Menu Mobile
function toggleMenu() { document.getElementById("menuDropdown").classList.toggle("show"); }
document.addEventListener("click", e => { if (!e.target.closest(".menu-wrapper")) document.getElementById("menuDropdown").classList.remove("show"); });
</script>

</body>
</html>
